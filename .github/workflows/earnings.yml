name: Update earnings calendar
on:
  schedule:
    - cron: '10 10,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch earnings
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          if [ -z "$FINNHUB_API_KEY" ]; then
            echo 'FINNHUB_API_KEY is not configured; skipping update.'
            exit 0
          fi
          node scripts/update-earnings.mjs
      - name: Commit updated data
        run: |
          git add data/earnings.json
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update earnings data'
          git push
