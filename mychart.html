<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MyChart — 自作トレーディングチャート</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5/dist/lightweight-charts.standalone.production.js"></script>
<!-- 線の設定モーダルはbody内に後で追加 -->
<style>
  :root {
    --bg:#0e1117; --panel:#161b24; --line:#232a36;
    --text:#d1d4dc; --muted:#787b86;
    --up:#26a69a; --down:#ef5350; --ema:#f5a623;
    --accent:#2962ff; --star:#f5c518;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { height:100%; touch-action:manipulation; }   /* 2回タップでの拡大を無効に */
  /* 画面の高さぴったりに合わせる。100dvh=スマホのアドレスバーを除いた実際の見える高さ */
  body { margin:0; height:100dvh; min-height:100dvh; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif; overscroll-behavior:none;
    display:flex; flex-direction:column; overflow:hidden; }
  .mono { font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums; }

  header { display:flex; align-items:center; gap:4px; padding:5px 10px; min-width:0;
    background:var(--panel); border-bottom:1px solid var(--line); }
  .sym-btn { display:flex; align-items:center; gap:6px; background:transparent;
    border:none; color:var(--text); font-size:17px; font-weight:700; letter-spacing:.5px; cursor:pointer;
    min-width:0; overflow:hidden; }
  /* 銘柄名が長くても「…」で省略し、右側のボタンを画面外へ押し出さない */
  .sym-btn #hdrTicker { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sym-btn .caret, .sym-btn .fav { flex:0 0 auto; }
  .sym-btn .caret { color:var(--muted); font-size:12px; }
  .sym-btn .fav { color:var(--star); font-size:14px; }
  .badge { flex:0 0 auto; font-size:10px; font-weight:700; padding:2px 4px; border-radius:4px; letter-spacing:0; }
  .badge.real   { background:rgba(38,166,154,.18); color:var(--up); }
  .badge.sample { background:rgba(120,123,134,.18); color:var(--muted); }
  .gear { margin-left:auto; background:transparent; border:none; color:var(--muted); font-size:18px; cursor:pointer; }
  .tf { display:flex; gap:4px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tf button { background:transparent; color:var(--muted); border:none; border-radius:6px;
    padding:6px 10px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; flex:0 0 auto; }
  .tf button.active { background:var(--accent); color:#fff; }

  /* 数値(OHLC)はチャートの上に重ねる（TradingViewと同じ方式）。
     独立した段にすると、iPhoneの狭い画面でチャートが37pxぶん削られてしまうため。
     pointer-events:none にして、チャートのスクロールや描画の邪魔をしない。
     ローソク足の上でも読めるよう、文字のふちに背景色の影を付ける */
  .legend { position:absolute; top:3px; left:10px; max-width:72%; z-index:8;
    display:flex; flex-wrap:wrap; gap:0 11px; font-size:11px; line-height:1.35;
    pointer-events:none;
    text-shadow:0 0 4px var(--bg), 0 0 3px var(--bg), 0 0 2px var(--bg); }
  .legend .item { color:var(--muted); }
  .legend .item b { color:var(--text); font-weight:600; margin-left:4px; }
  /* 日付は先頭に置くので余白を詰め、少し明るく */
  #lg-date { margin-left:0; color:#fff; }
  /* 当日の足など、まだ確定していない可能性がある足の印 */
  #lg-prov { color:var(--ema); margin-left:4px; font-weight:700; }
  .legend .up { color:var(--up); } .legend .down { color:var(--down); }
  /* ヘッダーと数値の行は左右スワイプで銘柄切替に使うので、文字選択を無効に */
  header, .legend { -webkit-user-select:none; user-select:none; touch-action:pan-y; }

  /* 分割レイアウト（1画面 / 上下 / 左右） */
  #splitWrap { flex:1; min-height:0; display:flex; }   /* ヘッダー等を除いた残りを全部使う */
  #splitWrap.split-1 { flex-direction:column; }
  #splitWrap.split-v { flex-direction:column; }   /* 上下 */
  #splitWrap.split-h { flex-direction:row; }      /* 左右 */
  #chartWrap { position:relative; flex:1; min-width:0; min-height:0; }
  #chart { width:100%; height:100%; }
  #c2pane { flex:1; min-width:0; min-height:0; display:none; flex-direction:column; border-top:1px solid var(--line); }
  .split-h #c2pane { border-top:none; border-left:1px solid var(--line); }
  #c2bar { display:flex; align-items:center; gap:10px; padding:4px 10px; font-size:12px; color:var(--muted);
    -webkit-user-select:none; user-select:none; touch-action:pan-y; }
  #c2bar #c2sym { color:var(--text); font-weight:700; font-size:13px; }
  #chart2 { flex:1; min-height:0; }
  #layoutBtn { margin-left:auto; background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:6px; padding:4px 9px; font-size:12px; font-weight:700; cursor:pointer; }
  /* チャート最大化中は、チャート以外の帯を隠す（ツールバーだけ残す） */
  body.max header, body.max footer, body.max .tools,
  body.max #tfRow, body.max .listTabs { display:none !important; }
  /* 最大化を解除する小さな戻るボタン（最大化中だけ右上に出る） */
  #unmaxBtn { position:fixed; top:8px; right:8px; z-index:30; display:none;
    background:rgba(22,27,36,.9); border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer; }
  body.max #unmaxBtn { display:block; }
  /* 銘柄の前/次ボタン。
     横スワイプはブラウザの「戻る」と取り合いになって誤作動するため、
     確実に押せる手段を用意する */
  .navsym { flex:0 0 auto; width:26px; background:transparent; border:1px solid var(--line);
    color:var(--text); font-size:20px; line-height:1; padding:5px 0; border-radius:7px; cursor:pointer; }
  .navsym:active { background:var(--accent); border-color:var(--accent); color:#fff; }
  #maxBtn, #refreshBtn, #penBtn { background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:6px; padding:4px 9px; font-size:12px; font-weight:700; cursor:pointer; margin-left:6px; }
  #refreshBtn.busy { opacity:.5; }
  /* z-index（重なり順の番号）が重要：チャート部品は内部で番号を持って前に出るため、
     こちらのレイヤーには明示的に大きい番号を付けて、必ずチャートより上に置く */
  #indOverlay { position:absolute; inset:0; pointer-events:none; z-index:4; }
  #overlay { position:absolute; inset:0; pointer-events:none; z-index:5; touch-action:none; }
  #catcher { position:absolute; inset:0; display:none; background:transparent; touch-action:none; cursor:crosshair; z-index:6; }
  /* 描画ツールの段は既定で隠す（TradingViewと同じく ✏ ボタンで開閉）。
     常に出しておくと、iPhoneの狭い画面ではチャートが47pxぶん削られてしまうため */
  .tools { display:none; align-items:center; gap:6px; padding:5px 12px; border-bottom:1px solid var(--line); overflow-x:auto; white-space:nowrap; }
  body.tools-open .tools { display:flex; }
  #penBtn.active { background:var(--accent) !important; color:#fff !important; border-color:var(--accent) !important; }
  .tools button { background:#1c2431; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font-size:12px; font-weight:600; cursor:pointer; }
  .tools button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tools input[type=color] { width:30px; height:30px; padding:0; border:1px solid var(--line); border-radius:6px; background:transparent; cursor:pointer; }
  /* 下のバーの「◯分前の保存データ」表示。エラー(赤)とは別の色で、
     異常ではないが注意して見てほしい、という位置づけ */
  footer .old { color:var(--ema); }
  footer { padding:3px 12px; font-size:10px; color:var(--muted); border-top:1px solid var(--line); min-height:20px; line-height:1.4; }
  footer .err { color:var(--down); }

  .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; visibility:hidden; transition:opacity .2s; z-index:10; }
  .backdrop.open { opacity:1; visibility:visible; }
  .drawer { position:fixed; top:0; left:0; height:100%; width:82%; max-width:340px;
    background:var(--panel); border-right:1px solid var(--line);
    transform:translateX(-100%); transition:transform .22s ease; z-index:11; display:flex; flex-direction:column; }
  .drawer.open { transform:translateX(0); }
  .drawer h2 { margin:0; padding:14px; font-size:15px; border-bottom:1px solid var(--line); display:flex; align-items:center; }
  .drawer h2 button { margin-left:auto; background:transparent; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1; }
  .list { overflow-y:auto; flex:1; }
  .row { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row.active { background:#1c2431; }
  .row .star { font-size:18px; color:#3a4250; width:22px; text-align:center; }
  .row .star.on { color:var(--star); }
  .row .tk { font-weight:700; font-size:15px; }
  .row .nm { color:var(--muted); font-size:11px; }
  .row .rt { margin-left:auto; text-align:right; }
  .row .price { font-size:14px; }
  .row .chg.up { color:var(--up); } .row .chg.down { color:var(--down); }
  .row .chg { font-size:12px; }
  .sec-label { padding:8px 14px; font-size:11px; color:var(--muted); background:#12161e; letter-spacing:1px; }
  .search { display:flex; gap:6px; padding:10px 14px; border-bottom:1px solid var(--line); }
  .search input { flex:1; min-width:0; background:#0e1117; border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:8px 10px; font-size:14px; text-transform:uppercase; }
  .search input::placeholder { color:var(--muted); text-transform:none; }
  .search button { border:none; border-radius:6px; padding:0 12px; font-size:13px; font-weight:700;
    cursor:pointer; white-space:nowrap; color:#fff; }
  .search #showBtn { background:var(--accent); }
  .search #addBtn { background:#2a3242; }
  .row .del { color:#5b6472; font-size:17px; padding:0 2px 0 6px; }
  /* 複数ウォッチリストの切り替えタブ（チップ） */
  .listTabs { display:flex; gap:6px; padding:8px 14px 0; flex-wrap:wrap; align-items:center; }
  .chip { background:#1c2431; color:var(--muted); border:1px solid var(--line); border-radius:14px;
    padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; }
  .chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip.mini { padding:5px 10px; }
  /* バックアップ欄（ウォッチリストの下） */
  .backup { border-top:1px solid var(--line); margin-top:10px; padding:10px 14px 16px; }
  .backup .bt { font-size:12px; color:var(--muted); margin-bottom:8px; }
  .backup .bbtns { display:flex; gap:8px; }
  .backup button { flex:1; background:#2a3242; color:var(--text); border:none; border-radius:6px;
    padding:9px 0; font-size:13px; font-weight:700; cursor:pointer; }
  .backup #bkExport { background:var(--accent); color:#fff; }
  .backup .warn { font-size:11px; color:#f5a623; margin-top:8px; line-height:1.5; }
  /* アプリ内の入力画面（promptの代わり。どの環境でも確実に動く） */
  .modalBack { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none;
    align-items:center; justify-content:center; z-index:20; }
  .modalBack.open { display:flex; }
  /* 画面より高くならないようにする。
     インジの設定は項目が15個ほどになることがあり、以前は下の
     「保存」ボタンが画面の外へ押し出されて押せなくなっていた */
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:16px; width:84%; max-width:320px;
    max-height:88vh; display:flex; flex-direction:column; min-height:0; }
  /* 中身だけをスクロールさせ、ボタンの行は常に見えるようにする */
  #indParams, #indEditor { flex-direction:column; min-height:0; }
  #indParamFields, #indList { overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; }
  #indParamFields { border-bottom:1px solid var(--line); padding-bottom:6px; }
  .modal .mbtns { flex:0 0 auto; }
  .modal .mtitle { font-size:14px; font-weight:700; margin-bottom:10px; white-space:pre-line; }
  .modal input { width:100%; background:#0e1117; border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:9px 10px; font-size:14px; }
  .modal .mbtns { display:flex; gap:8px; margin-top:12px; }
  .modal .mbtns button { flex:1; border:none; border-radius:6px; padding:9px 0; font-size:13px; font-weight:700; cursor:pointer; }
  #modalCancel { background:#2a3242; color:var(--text); }
  #modalOk { background:var(--accent); color:#fff; }
  /* 自作インジケーターの管理画面 */
  .indRow { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .indRow .nm { flex:1; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #indName { width:100%; background:#0e1117; border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:9px 10px; font-size:14px; margin-bottom:8px; }
  #indCode { width:100%; height:220px; background:#0e1117; border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:9px 10px; font-size:12px; line-height:1.5;
    font-family:ui-monospace,"SF Mono",Menlo,monospace; }
  #indListBtns button, #indEditor .mbtns button { flex:1; border:none; border-radius:6px; padding:9px 0;
    font-size:13px; font-weight:700; cursor:pointer; }
  #indClose, #indCancel { background:#2a3242; color:var(--text); }
  #indNew, #indSave { background:var(--accent); color:#fff; }
  /* チャート左上のインジ名チップ（タップで表示/非表示） */
  /* 数値の段をチャート上に重ねたので、チップはその下へずらす */
  #indChips { position:absolute; top:38px; left:8px; z-index:7; display:flex; flex-wrap:wrap; gap:4px; max-width:72%; align-items:flex-start; }
  #indToggleBtn { background:rgba(22,27,36,.88); border:1px solid var(--line); color:var(--muted);
    border-radius:6px; padding:3px 7px; font-size:11px; cursor:pointer; flex:none; }
  #indChips.collapsed .ichip { display:none; }
  /* 読み込み中の覆い。
     銘柄を切り替えるとヘッダーの名前は即座に変わるが、チャートは
     データが届くまで前の銘柄のまま。API上限で最大60秒待つことがあるため、
     その間「別の銘柄のチャートを新しい銘柄だと思って読む」危険がある。
     覆ってしまえば読み間違えようがない（タップも通さない） */
  #staleNote { position:absolute; inset:0; z-index:9; display:none;
    align-items:center; justify-content:center; text-align:center; white-space:pre-line;
    background:rgba(14,17,23,.80); color:var(--ema); font-size:13px; line-height:1.7; padding:0 22px; }
  body.loading #staleNote { display:flex; }
  .ichip .ival { font-variant-numeric:tabular-nums; font-weight:700; margin-left:5px; }   /* 十字線の位置のインジ値 */
  /* スコア表（インジのtable()が右上に出す） */
  #indTable { position:absolute; top:6px; right:8px; z-index:7; border-collapse:collapse;
    font-size:10px; background:rgba(14,17,23,.9); border:1px solid var(--line); display:none; }
  #indTable td { border:1px solid #2a3242; padding:2px 6px; color:#fff; white-space:nowrap; }
  .ichip { display:flex; align-items:center; gap:6px; background:rgba(22,27,36,.88); border:1px solid var(--line);
    border-radius:6px; padding:3px 8px; font-size:11px; color:var(--text); cursor:pointer; }
  .ichip.off { opacity:.4; }
  .ichip.err { border-color:#ef5350; }   /* エラーのあるインジは赤枠 */
  .ichip.warn { border-color:#f5a623; }  /* サンプルで計算中は橙枠＋⚠ */
  .ichip .g { color:var(--muted); font-size:12px; }
  /* 設定フォームの部品（線の設定・インジの設定で共用） */
  .dsRow { display:flex; align-items:center; gap:10px; margin:10px 0; }
  .dsRow label { min-width:58px; font-size:13px; color:var(--muted); }
  .dsRow select, .pfield { flex:1; min-width:0; background:#0e1117; border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:8px 10px; font-size:14px; }
  .dsRow input[type=color] { flex:1; height:40px; padding:2px; background:#0e1117; border:1px solid var(--line); border-radius:6px; }
  #ipCode { background:#2a3242 !important; color:var(--text) !important; }
</style>
</head>
<body>

  <header>
    <button id="prevSym" class="navsym" title="前の銘柄">‹</button>
    <button class="sym-btn" id="symBtn" title="タップでウォッチリスト">
      <span class="fav" id="hdrFav" style="display:none">★</span>
      <span id="hdrTicker">-</span>
    </button>
    <button id="nextSym" class="navsym" title="次の銘柄">›</button>
    <span class="badge sample" id="badge">サンプル</span>
    <button id="layoutBtn" title="画面の分割を切り替え">▢</button>
    <button id="penBtn" title="描画ツールの表示/非表示">✏</button>
    <button id="refreshBtn" title="最新データに更新">⟳</button>
    <button id="maxBtn" title="チャートを最大化">⛶</button>
    <button class="gear" id="gear" title="APIキー設定" style="margin-left:0;">⚙</button>
  </header>
  <button id="unmaxBtn">⛶ 解除</button>

  <div id="tfRow" style="padding:4px 12px; border-bottom:1px solid var(--line);">
    <div class="tf" id="tfButtons">
      <button data-step="65m">65分</button>
      <button data-step="1d" class="active">日足</button>
      <button data-step="1w">週足</button>
      <button data-step="1M">月足</button>
      <button data-step="3M">3ヶ月</button>
      <button data-step="6M">6ヶ月</button>
      <button id="scaleBtn" title="価格目盛りの切り替え" style="border-left:1px solid var(--line); border-radius:0;">対数</button>
      <button id="indBtn" title="自作インジケーター">インジ</button>
    </div>
  </div>

  <div class="tools" id="toolbar">
    <button data-tool="hline">─ 水平線</button>
    <button data-tool="trend">／ トレンド</button>
    <button data-tool="rect">▢ 計測ボックス</button>
    <button data-tool="au">↑ 矢印</button>
    <button data-tool="ad">↓ 矢印</button>
    <button data-tool="poly">〰 折線</button>
    <button data-tool="pos">± 損益</button>
    <button data-tool="vp">▤ 出来高P</button>
    <input type="color" id="colorPick" value="#f5c518" title="線の色" />
    <button id="magnetBtn" title="高値・安値に吸い付かせる">🧲 吸着</button>
    <button id="undoBtn" title="元に戻す">↶ 戻す</button>
    <button id="styleBtn" style="display:none;">線の設定</button>
    <button id="delOneBtn" style="display:none; border-color:#ef5350; color:#ef5350;">選択を削除</button>
    <button id="clearBtn">消去</button>
  </div>

  <div id="splitWrap" class="split-1">
    <div id="chartWrap">
      <div id="chart"></div>
      <svg id="indOverlay"></svg>
      <svg id="overlay"></svg>
      <div id="catcher"></div>
      <div id="indChips"></div>
      <div id="staleNote"></div>
      <div class="legend mono">
        <span class="item" id="lg-date-wrap"><b id="lg-date">-</b></span>
        <span class="item">O<b id="lg-o">-</b></span>
        <span class="item">H<b id="lg-h">-</b></span>
        <span class="item">L<b id="lg-l">-</b></span>
        <span class="item">C<b id="lg-c">-</b></span>
        <span class="item">前日比<b id="lg-chg">-</b></span>
        <span class="item">出来高<b id="lg-vol">-</b></span>
      </div>
    <table id="indTable"></table>
    </div>
    <div id="c2pane">
      <div id="c2bar">
        <span id="c2sym">SOXX ▾</span>
        <span id="c2price" class="mono"></span>
      </div>
      <div id="chart2"></div>
    </div>
  </div>
  <footer id="foot">出来高2倍強調つき / ⚙:APIキー / 「インジ」で自作インジを追加できます</footer>

  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer">
    <h2>ウォッチリスト <button id="closeDrawer">×</button></h2>
    <div class="search">
      <input id="tickerInput" class="mono" type="text" placeholder="ティッカー入力 (例: AAPL,NVDA)"
             autocapitalize="characters" autocomplete="off" spellcheck="false" />

<script>
/* =========================================================
   保存ヘルパー（お気に入り・APIキーを端末に記憶）
   ・公開版では閉じても残る。プレビュー内はリロードで消える場合あり
   ========================================================= */
// 端末の保存を一度読んだらメモリに持っておくための入れ物
// （store より前に宣言しておく。後ろに置くと、保存失敗時の救済処理で
//   「宣言前アクセス」の例外が出てアプリ全体が止まるため）
let diskMem=null;

/* 保存の優先順位
   ウォッチリスト・描画・インジ＝二度と戻らない大事なデータ
   価格キャッシュ＝取り直せる使い捨てデータ
   容量が足りない時は、使い捨ての方を捨てて大事なデータを守る。
   （以前は失敗しても無言で、設定が黙って消える作りだった） */
let storeWarned=false;
/* このファイルの版数。差し替えたのに古い画面が出ている、という混乱を防ぐため、
   起動時に下のバーへ表示する。数字が変わっていなければ差し替えできていない */
const APP_VERSION='v45 (リスト削除も取り消せるように)';

const store = {
  get(k, fb){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } },
  set(k, v){
    const text=JSON.stringify(v);
    try { localStorage.setItem(k, text); return true; } catch(e){}
    // ①価格キャッシュを丸ごと捨てて再挑戦
    try{
      localStorage.removeItem('mychart-cache-v1');
      diskMem=null;
      localStorage.setItem(k, text);
      const f=document.getElementById('foot');
      if(f) f.textContent='保存領域が不足したため、価格データの一時保存を整理しました（設定は保存済み）';
      return true;
    }catch(e2){}
    // ②それでもダメなら警告（黙って失敗させない）
    const f=document.getElementById('foot');
    if(f) f.innerHTML='<span class="err">保存できませんでした（端末の空き容量不足）。バックアップの書き出しをおすすめします</span>';
    storeWarned=true;
    return false;
  }
};

/* 画面に文字を出す時、記号がHTMLとして解釈されないようにする。
   インジ名やエラー文に " や < が入ると、設定画面や下のバーが崩れるため */
function escHtml(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* エラーが起きたら、下のバーに表示する（今後は画面を見せてもらうだけで原因が分かる） */
window.addEventListener('error', e=>{
  const f=document.getElementById('foot');
  if(f) f.innerHTML = '<span class="err">エラー: '+escHtml(e.message||'不明なエラー')+'</span>';
});

/* 非同期処理（データ取得など）の失敗も拾う。
   これが無いと、取得に失敗しても画面に何も出ず「読み込み中…」のまま黙って止まる。
   「黙って失敗させない」という、このアプリの方針にそろえる */
window.addEventListener('unhandledrejection', e=>{
  const f=document.getElementById('foot'); if(!f) return;
  const r=e.reason;
  const msg = (r && r.message) ? r.message
            : (r && r.kind==='nokey') ? 'APIキーが未設定です'
            : (r && r.kind) ? String(r.kind)
            : String(r||'不明なエラー');
  f.innerHTML = '<span class="err">処理に失敗しました: '+escHtml(msg)+'</span>';
});

/* URLの「#key=～」からAPIキーを受け取る仕組み
   ブックマークのURLにキーを仕込んでおけば、開くだけで毎回自動セットされる。
   （Safariは7日間訪れないサイトの保存データを消すことがあるため、その対策）
   読み取ったらアドレスバーからは消して、肩越しに見られても分からないようにする */
(function(){
  // 英数字だけを拾っていたため、キーに - や _ が含まれていると途中で切れ、
  // 「間違ったキーが保存され、原因の分かりにくいAPIエラーになる」状態だった
  const m = location.hash.match(/key=([A-Za-z0-9_\-]+)/);
  if(m){
    store.set('td-key', m[1]);
    history.replaceState(null, '', location.pathname + location.search);
  }
})();

/* =========================================================
   ① 銘柄リスト … ここに自分の小型株・バイオを足せます
   ========================================================= */
const SYMBOLS = [
  { ticker:'NVDA', name:'エヌビディア', base:120 },
  { ticker:'SOXX', name:'半導体ETF',   base:210 },
  { ticker:'XBI',  name:'バイオETF',    base:95  },
  { ticker:'IWM',  name:'小型株ETF',    base:220 },
  { ticker:'ABCL', name:'AbCellera',    base:5   },
  { ticker:'RXRX', name:'Recursion',    base:7   },
  { ticker:'CRSP', name:'CRISPR',       base:45  },
  { ticker:'BEAM', name:'Beam Thera',   base:25  },
];

/* 時間足の定義表
   api  … Twelve Dataに頼む足の種類
   size … 何本取ってくるか
   agg  … 取った後に「束ねる」処理（65分足=5分×13本、3ヶ月足=月足×3本 など）*/
const TF = {
  '65m': { label:'65分',  api:'5min',   size:5000, agg:'65' },
  '1d':  { label:'日足',  api:'1day',   size:2500 },   // 約10年（上場来判定のため長めに）
  '1w':  { label:'週足',  api:'1week',  size:1000 },   // 約20年
  '1M':  { label:'月足',  api:'1month', size:240 },
  '3M':  { label:'3ヶ月', api:'1month', size:240, agg:3 },
  '6M':  { label:'6ヶ月', api:'1month', size:240, agg:6 },
};

/* --- 束ねる処理の共通部品 ---
   何本かのローソク足を1本にまとめる：始値=最初 / 高値=一番高い / 安値=一番安い / 終値=最後 / 出来高=合計 */
function bundle(bucket, time){
  return {
    candle:{ time, open:+bucket[0].open,
      high: Math.max(...bucket.map(r=>+r.high)),
      low:  Math.min(...bucket.map(r=>+r.low)),
      close:+bucket[bucket.length-1].close },
    volume:{ time, value: bucket.reduce((a,r)=>a+ +(r.volume||0),0) }
  };
}

/* 5分足 → 65分足（同じ日の中で13本ずつ束ねる。9:30開始なら1日ちょうど6本） */
function to65(rows){
  const candles=[], volumes=[];
  let bucket=[], curDay='';
  const flush=()=>{
    if(!bucket.length) return;
    // 時刻つきの足は「秒数（エポック秒）」で持つのがチャート部品の作法。
    // 端末のタイムゾーンで解釈すると9時間ズレるため、UTCで組み立てる
    const dt=bucket[0].datetime.replace(' ','T');
    const [dpart,tpart]=dt.split('T');
    const [Y,M,D]=dpart.split('-').map(Number);
    const [h,mi]=(tpart||'00:00').split(':').map(Number);
    const t=Math.floor(Date.UTC(Y,(M||1)-1,D||1,h||0,mi||0)/1000);
    const b=bundle(bucket, t);
    candles.push(b.candle); volumes.push(b.volume); bucket=[];
  };
  rows.forEach(r=>{
    const day=r.datetime.slice(0,10);
    if(day!==curDay){ flush(); curDay=day; }   // 日が変わったら区切る
    bucket.push(r);
    if(bucket.length===13) flush();            // 13本たまったら1本に
  });
  flush();
  return {candles, volumes};
}

/* 日足 → 週足（月曜はじまりの週ごとに束ねる） */
function toWeeks(rows){
  const candles=[], volumes=[];
  let bucket=[], curKey='';
  // 「今日が世界の始まりから何週目か」を計算して、同じ週の足をまとめる
  // 日付文字列から直接「何日目か」を出す。
  // Date.parse は端末のタイムゾーンで解釈されるため、日本(+9時間)だと
  // 1日ぶんズレて、月曜が前の週に入ってしまっていた
  const keyOf=r=>{
    const [y,m,d]=r.datetime.slice(0,10).split('-').map(Number);
    const days=Math.floor(Date.UTC(y,(m||1)-1,d||1)/86400000);
    return Math.floor((days+3)/7);     // 月曜はじまりの週番号
  };
  const flush=()=>{
    if(!bucket.length) return;
    const b=bundle(bucket, bucket[0].datetime.slice(0,10));
    candles.push(b.candle); volumes.push(b.volume); bucket=[];
  };
  rows.forEach(r=>{ const key=keyOf(r); if(key!==curKey){ flush(); curKey=key; } bucket.push(r); });
  flush();
  return {candles, volumes};
}

/* 月足 → 3ヶ月足/6ヶ月足（1-3月、4-6月…のように暦で区切って束ねる） */
function toMonths(rows, k){
  const candles=[], volumes=[];
  let bucket=[], curKey='';
  const keyOf=r=>{ const y=r.datetime.slice(0,4), m=+r.datetime.slice(5,7); return y+'-'+Math.floor((m-1)/k); };
  const flush=()=>{
    if(!bucket.length) return;
    const b=bundle(bucket, bucket[0].datetime.slice(0,10));
    candles.push(b.candle); volumes.push(b.volume); bucket=[];
  };
  rows.forEach(r=>{ const key=keyOf(r); if(key!==curKey){ flush(); curKey=key; } bucket.push(r); });
  flush();
  return {candles, volumes};
}

/* =========================================================
   複数ウォッチリスト
   lists = [{ id, name, tickers:[...] }, ...] を端末に保存
   初回は「メイン」リストを作り、昔の追加銘柄も引き継ぐ
   ========================================================= */
let lists = store.get('mychart-lists', null);
if(!lists || !lists.length){
  const legacy = store.get('user-symbols', []); // 旧バージョンで追加した銘柄
  lists = [{ id:1, name:'メイン', tickers:[...SYMBOLS.map(s=>s.ticker), ...legacy.map(u=>u.ticker)] }];
  store.set('mychart-lists', lists);
}
let activeListId = store.get('mychart-active-list', lists[0].id);
if(!lists.some(L=>L.id===activeListId)) activeListId = lists[0].id;

function activeList(){ return lists.find(L=>L.id===activeListId) || lists[0]; }
function saveLists(){ store.set('mychart-lists', lists); }
// ティッカーから表示用の情報（名前など）を返す
function symInfo(t){ return SYMBOLS.find(s=>s.ticker===t) || { ticker:t, name:'追加した銘柄' }; }

/* =========================================================
   ② 実データ取得（Twelve Data）
   キーが無い/失敗した時は例外を投げ、呼び出し側でサンプルに切替
   ========================================================= */
/* APIの流量制御：無料枠は「1分あたり8回」。
   これを超えると失敗するので、超えそうな時は自動で少し待ってから投げる。
   （銘柄をスワイプで次々変えた時に上限に当たるのを防ぐ） */
/* iOSのSafari/Chromeは viewport の user-scalable=no を無視するため、
   2本指のつまむ操作や素早い2回タップで「ページ全体」が拡大してしまう。
   チャートの拡大縮小はチャート部品が指の動き(touch)で自前に行うので、
   ブラウザ側の拡大だけを止める。
   ・gesture系 … iOS独自の2本指ズーム。これを止めるのが本命
   ・2回タップ … touch-action:manipulation で無効になるが、
     効かない場面があるので時間差でも判定して止める */
(function(){
  ['gesturestart','gesturechange','gestureend'].forEach(ev=>{
    document.addEventListener(ev, e=>{ e.preventDefault(); }, {passive:false});
  });
  let lastTouch=0;
  document.addEventListener('touchend', e=>{
    const now=Date.now();
    if(now-lastTouch < 320 && e.touches.length===0) e.preventDefault();  // 2回タップ拡大
    lastTouch=now;
  }, {passive:false});
  // 指2本以上が同時に触れた時、チャート以外では既定動作をさせない
  document.addEventListener('touchmove', e=>{
    if(e.touches.length>1) e.preventDefault();
  }, {passive:false});
})();

/* 下のバーにメッセージを出す。
   apiGate / apiBump は main() の外にあるため、main() の中で定義された
   関数は見えない。ここで最上位に置いておく。
   これが無かったため、API上限に当たって待とうとした瞬間に
   「Can't find variable: setFoot」で取得そのものが失敗し、
   サンプル表示に落ちていた（v30でレート制限を保存したことで露出した）。
   起動直後で要素がまだ無い場合も落ちないようにする */
function setFoot(msg){
  const f=document.getElementById('foot');
  if(f) f.textContent = msg;
}

/* 上限は「1分8回」だが7回で止める。
   端末とサーバの時計が少しずれていると、8回目がサーバ側では
   前の1分に入って9回目と数えられることがあるため、1回ぶん余裕を持たせる */
const API_LIMIT=7, API_WINDOW=60000;
const API_TIMES_KEY='mychart-api-times';

/* 使用時刻は端末に保存する。
   これまではメモリ上の変数だけだったため、ページを開き直すと記録が
   空に戻り、サーバ側にはまだ8回ぶん残っているのに「余裕がある」と
   判断して投げ続け、弾かれ続けていた。
   版を差し替えて読み込み直す使い方だと、これが必ず起きる */
function apiTimesLoad(){
  const v=store.get(API_TIMES_KEY, []);
  if(!Array.isArray(v)) return [];
  const now=Date.now();
  return v.filter(t=>typeof t==='number' && now-t<API_WINDOW && t<=now);
}
function apiTimesSave(a){ store.set(API_TIMES_KEY, a); }

let apiChain=Promise.resolve();
function apiGate(){
  apiChain = apiChain.then(async ()=>{
    let times=apiTimesLoad();
    if(times.length>=API_LIMIT){
      const wait=API_WINDOW-(Date.now()-times[0])+250;
      if(wait>0){
        setFoot('API上限（1分'+API_LIMIT+'回）のため '+Math.ceil(wait/1000)+'秒待機中…');
        await new Promise(r=>setTimeout(r, wait));
      }
      times=apiTimesLoad();
    }
    times.push(Date.now());
    apiTimesSave(times);
  });
  return apiChain;
}

/* APIから来た1本が使える足かどうかを判定する */
function isSaneRow(v){
  if(!v || typeof v.datetime!=='string' || v.datetime.length<10) return false;
  const o=+v.open, h=+v.high, l=+v.low, c=+v.close;
  if(![o,h,l,c].every(x=>isFinite(x) && x>0)) return false;   // 数値でない・0以下は捨てる
  if(h<l) return false;                                        // 高値が安値を下回るのは異常
  return true;
}

/* 1日のAPI回数を数える。無料枠は1日800回。
   これまでは数えていなかったため、使い切ると理由が分からないまま
   全部サンプル表示に落ちていた。あくまで端末側で数えた「おおよその目安」
   （サーバ側の実際の残り回数とは多少ずれる） */
const API_DAY_LIMIT=800;
function apiDayKey(){
  const d=new Date();   // 日付の判定はUTC基準（設計ルール①）
  return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');
}
function apiCount(){
  const v=store.get('mychart-api-count', null);
  return (v && v.d===apiDayKey()) ? v : { d:apiDayKey(), n:0 };
}
function apiBump(){
  const c=apiCount(); c.n++; store.set('mychart-api-count', c);
  const left=API_DAY_LIMIT-c.n;
  if(left===100 || left===30 || left===0){
    setFoot(left>0 ? ('APIの残りが約'+left+'回です（1日800回）')
                   : '本日のAPI回数を使い切りました。日付が変わると回復します');
  }
  return c.n;
}

/* Twelve Dataのエラー文は英語なので、よくあるものを日本語にする。
   「You have run out of API credits...」のまま出しても、
   何をすればよいのか分からないため */
function apiErrJa(msg){
  const m=String(msg||'');
  if(/run out of API credits|api credits/i.test(m)){
    return /day|daily/i.test(m)
      ? '本日のAPI回数（1日800回）を使い切りました。日付が変わると回復します'
      : 'API回数（1分8回）を超えました。少し待つと回復します';
  }
  if(/not found|does not exist|invalid symbol|symbol.*invalid/i.test(m)) return '銘柄が見つかりません（ティッカーをご確認ください）';
  if(/api ?key|unauthorized|forbidden|authentic/i.test(m)) return 'APIキーが正しくないようです（⚙から入れ直してください）';
  if(/plan|upgrade|grow|pro\b/i.test(m)) return 'この銘柄・時間足は無料プランでは取得できないようです';
  return m;
}

async function fetchReal(symbol, step){
  const key = store.get('td-key','');
  if(!key) throw { kind:'nokey' };
  await apiGate();   // 上限に当たらないよう順番待ち
  apiBump();         // 1日の使用回数を1つ進める
  const tf = TF[step];
  const url = `https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(symbol)}`
            + `&interval=${tf.api}&outputsize=${tf.size}&apikey=${key}`;
  const res = await fetch(url);
  // HTTPの状態を確認していなかったため、エラーページ(HTML)が返ってきた時に
  // 「JSONが読めない」という分かりにくい例外になり、通信エラー扱いされていた
  if(!res.ok){
    throw { kind:'api', message:
      res.status===429 ? 'API回数の上限に達しました。少し待ってからお試しください'
      : res.status>=500 ? ('Twelve Data側で一時的な不具合が起きているようです（'+res.status+'）')
      : ('取得に失敗しました（HTTP '+res.status+'）') };
  }
  let json;
  try{ json = await res.json(); }
  catch(e){ throw { kind:'api', message:'応答を読み取れませんでした（通信が不安定かもしれません）' }; }
  if(json.status === 'error' || !json.values) throw { kind:'api', message: apiErrJa(json.message || '取得失敗') };
  // Twelve Dataは「新しい順」で返すので、古い順に並べ替える
  // 受け取った1本1本を検証し、壊れている足は捨てる。
  // （日付が無い・価格が数値でない等をそのまま通すと、
  //   チャートが崩れたり、移動平均が全部NaNになって以降の足まで汚染される）
  let rows = json.values.slice().reverse().filter(isSaneRow);
  // 同じ時刻の足が二重に来ることがある。そのまま通すと、線の位置を計算する
  // tsToLogical() が「間隔ゼロ」で割り算をして Infinity になり、
  // 描いた線が異常な位置へ飛ぶ。ここで新しい方だけを残す
  const seen=new Set(); const uniq=[];
  for(let i=rows.length-1;i>=0;i--){
    const key=String(rows[i].datetime);
    if(seen.has(key)) continue;
    seen.add(key); uniq.push(rows[i]);
  }
  rows = uniq.reverse();
  if(!rows.length) throw { kind:'api', message:'有効なデータがありません（銘柄名をご確認ください）' };
  if(tf.agg==='65') return to65(rows);              // 65分足に束ねる
  if(tf.agg)        return toMonths(rows, tf.agg);  // 3ヶ月/6ヶ月足に束ねる
  const candles = rows.map(v => ({ time:String(v.datetime).slice(0,10), open:+v.open, high:+v.high, low:+v.low, close:+v.close }));
  const volumes = rows.map(v => ({ time:String(v.datetime).slice(0,10), value:+(v.volume||0) }));
  return { candles, volumes };
}

/* =========================================================
   ③ サンプルデータ（キーが無い時／取得失敗時のフォールバック）
   本物と同じ考え方：まず「日足の歴史」を1本だけ作り、
   週足・月足・3ヶ月・6ヶ月・65分足は全部そこから束ねて作る。
   → どの時間足でも同じ値動き・同じ価格帯になる
   ========================================================= */
function seedFrom(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return (h>>>0)%1e6+1; }
const r2=n=>Math.round(n*100)/100;

/* 銘柄ごとに「約20年ぶんの日足」を1回だけ作ってキャッシュする */
/* サンプルデータの保持にも上限を設ける。
   1銘柄あたり20年分（約690KB）を作るので、上限が無いと
   監視リストを一周しただけで100MB近く使い、Safariが落ちる */
const SAMPLE_MAX_SYMBOLS=8;
const dailyCache={}; let dailyOrder=[];
function dailyTouch(ticker){
  dailyOrder=dailyOrder.filter(t=>t!==ticker); dailyOrder.push(ticker);
  let guard=dailyOrder.length+2;
  while(dailyOrder.length>SAMPLE_MAX_SYMBOLS && guard-- > 0){
    const old=dailyOrder.shift();
    if(old===current.ticker || old===c2.ticker){ dailyOrder.push(old); continue; }
    delete dailyCache[old];
    Object.keys(sampleCache).forEach(k=>{ if(k.startsWith(old+'@')) delete sampleCache[k]; });
  }
}
function dailyRowsFor(ticker){
  dailyTouch(ticker);
  if(dailyCache[ticker]) return dailyCache[ticker];
  const sym=SYMBOLS.find(s=>s.ticker===ticker);
  const base=sym?sym.base:20;
  let s=seedFrom(ticker); const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };

  // 平日（月〜金）の日付を過去20年ぶん集める
  const dates=[]; const d=new Date();
  // 日付の計算はUTCでそろえる（端末のタイムゾーンで1日ズレるのを防ぐ）
  d.setUTCHours(12,0,0,0);
  while(dates.length<5040){                     // 252営業日 × 20年
    const dow=d.getUTCDay();
    if(dow!==0 && dow!==6) dates.push(d.toISOString().slice(0,10));
    d.setUTCDate(d.getUTCDate()-1);
  }
  dates.reverse();

  // ランダムウォークで日足を作る（1日±1%程度、ゆるい上昇バイアス）
  let price=base; const rows=[];
  for(const date of dates){
    const open=price;
    const close=Math.max(0.5, open+(rnd()-0.495)*price*0.02);
    const high=Math.max(open,close)+rnd()*price*0.01;
    const low =Math.min(open,close)-rnd()*price*0.01;
    rows.push({ datetime:date, open, high, low, close,
      volume:Math.round((0.4+rnd()*1.4)*(rnd()<0.12?3:1)*1_000_000) });
    price=close;
  }
  // 最後の終値がちょうど base になるよう、全体を同じ倍率で調整
  const f=base/rows[rows.length-1].close;
  rows.forEach(r=>{ r.open=r2(r.open*f); r.high=r2(r.high*f); r.low=r2(r.low*f); r.close=r2(r.close*f); });
  return dailyCache[ticker]=rows;
}

/* 日足の並びを、チャートに渡す形（candles/volumes）に変える */
function rowsToRaw(rows){
  return {
    candles: rows.map(r=>({ time:r.datetime.slice(0,10), open:r.open, high:r.high, low:r.low, close:r.close })),
    volumes: rows.map(r=>({ time:r.datetime.slice(0,10), value:r.volume }))
  };
}

/* 直近の日足から65分足を作る（1日6本、9:30開始。始値と終値は日足と一致させる） */
function make65FromDaily(rows){
  const candles=[], volumes=[];
  const days=rows.slice(-45);                       // 直近45営業日ぶん
  let s=seedFrom('65m'); const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  days.forEach(r=>{
    // 端末のタイムゾーンで解釈すると9時間ズレるため、UTCで組み立てる
    const [yy,mm,dd]=r.datetime.slice(0,10).split('-').map(Number);
    const t0=Math.floor(Date.UTC(yy,(mm||1)-1,dd||1,9,30)/1000);
    let p=r.open;
    for(let i=0;i<6;i++){
      const open=p;
      // その日の始値→終値へ少しずつ近づけ、最後の1本はぴったり終値で締める
      const target=r.open+(r.close-r.open)*((i+1)/6);
      const close=(i===5)? r.close : r2(target+(rnd()-0.5)*r.open*0.004);
      const high=r2(Math.max(open,close)+rnd()*r.open*0.003);
      const low =r2(Math.min(open,close)-rnd()*r.open*0.003);
      candles.push({ time:t0+i*65*60, open:r2(open), high, low, close });
      volumes.push({ time:t0+i*65*60, value:Math.round(r.volume/6*(0.6+rnd()*0.8)) });
      p=close;
    }
  });
  return {candles, volumes};
}

/* 共通の後処理：EMA40と出来高2倍強調 */
function colorVolumes(candles,volumes){
  const W=15;   // サージ判定に使う「直近何本の平均か」
  // 先に「年ごとの最高出来高」と「全期間の最高出来高」を調べておく
  // 年の判定もUTC基準にそろえる（端末のタイムゾーンで年末年始がズレるのを防ぐ）
  const yearOf=t=> typeof t==='number' ? new Date(t*1000).getUTCFullYear() : +String(t).slice(0,4);
  const yearMax={}, yearCount={}; let allMax=0;
  volumes.forEach((v,i)=>{
    const y=yearOf(candles[i].time);
    yearCount[y]=(yearCount[y]||0)+1;
    if(!(y in yearMax) || v.value>yearMax[y]) yearMax[y]=v.value;
    if(v.value>allMax) allMax=v.value;
  });
  // 「その年の最高」は、1年に十分な本数がある時だけ意味がある。
  // 3ヶ月足(年4本)・6ヶ月足(年2本)だと25〜50%が白くなり、
  // 強調のはずが単なる模様になっていたため、年12本未満では付けない
  const YEAR_MIN=12;
  return volumes.map((v,i)=>{
    const sl=volumes.slice(Math.max(0,i-W),i);
    const avg=sl.length?sl.reduce((a,b)=>a+b.value,0)/sl.length:v.value;
    const up=candles[i].close>=candles[i].open;
    const y=yearOf(candles[i].time);
    // 色の優先順位: 全期間最高 > その年の最高 > 2倍サージ > 通常
    let color;
    if(v.value===allMax && allMax>0)           color='#e040fb';   // 紫: 読み込んだ全期間での最高
    else if(v.value===yearMax[y] && v.value>0 && yearCount[y]>=YEAR_MIN) color='#ffffff';   // 白: その年の最高(今年=年初来高出来高)
    else if(v.value>=avg*2)                    color='#f5a623';   // アンバー: 平均の2倍サージ
    else color = up ? 'rgba(38,166,154,0.45)' : 'rgba(239,83,80,0.45)';
    return {time:v.time, value:v.value, color};
  });
}
function pack(raw){ return { candles:raw.candles, vols:colorVolumes(raw.candles,raw.volumes) }; }

/* サンプルをキャッシュして返す（全部、同じ日足の歴史から束ねて作る） */
const sampleCache={};
function sampleDataset(ticker,step){
  const key=ticker+'@'+step; if(sampleCache[key]) return sampleCache[key];
  const rows=dailyRowsFor(ticker);
  let raw;
  if(step==='65m')      raw=make65FromDaily(rows);            // 直近の日足から65分足を合成
  else if(step==='1d')  raw=rowsToRaw(rows.slice(-2520));    // 約10年ぶん
  else if(step==='1w')  raw=toWeeks(rows);                    // 約20年ぶんを週で束ねる
  else if(step==='1M')  raw=toMonths(rows,1);                 // 月で束ねる（約20年）
  else if(step==='3M')  raw=toMonths(rows,3);                 // 四半期で束ねる
  else                  raw=toMonths(rows,6);                 // 半年で束ねる
  return sampleCache[key]=pack(raw);
}

/* =========================================================
   API節約のしくみ（2本立て）
   ① 日足を1回取れば、週足・月足・3ヶ月・6ヶ月は自分で束ねて作る
      → 時間足を変えてもAPIを使わない
   ② 取ったデータを端末に保存し、次回開いた時も使い回す
      → 同じ銘柄の2回目以降はAPIを使わない
   ========================================================= */
const DISK_KEY='mychart-cache-v1';
/* 端末に残す「枠」の数。数えているのは銘柄数ではなく ticker@時間足 の組み合わせ。
   同じ銘柄でも日足と65分足を見れば2枠使う。
   IndexedDBに移したことで容量の制約が外れたため、10枠 → 120枠に増やした。
   （日足1銘柄で約150KB。120枠でも20MB弱で、IndexedDBの容量には十分収まる）
   LS_MAX は、IndexedDBが使えない環境で localStorage に落ちた時の上限。
   こちらは容量が5MBしかないので従来どおり控えめにする */
const DISK_MAX=120;
const LS_MAX=10;
const TTL_DAILY=12*3600*1000;         // 日足系は12時間で作り直す
const TTL_INTRA=15*60*1000;           // 65分足は15分

/* 保存形式を圧縮する（項目名の繰り返しをやめて配列にする → 約6割減）*/
function packRows(raw){
  return { t:raw.candles.map(c=>c.time),
           o:raw.candles.map(c=>c.open), h:raw.candles.map(c=>c.high),
           l:raw.candles.map(c=>c.low),  c:raw.candles.map(c=>c.close),
           v:raw.volumes.map(x=>x.value) };
}
function unpackRows(z){
  // 列が1つでも欠けていたら使わない。
  // 以前は t の有無だけ見ていたため、o/h/l/c/v が欠けた保存を読むと
  // z.o[i] で例外になり、チャート全体が表示できなくなる可能性があった
  if(!z || !Array.isArray(z.t)) return null;
  for(const key of ['o','h','l','c','v']){
    if(!Array.isArray(z[key]) || z[key].length!==z.t.length) return null;
  }
  return { candles:z.t.map((t,i)=>({time:t, open:z.o[i], high:z.h[i], low:z.l[i], close:z.c[i]})),
           volumes:z.t.map((t,i)=>({time:t, value:z.v[i]})) };
}

/* ---- 端末保存：IndexedDB（容量が桁違いに大きい） ----
   これまでは localStorage に入れていたが、容量が約5MBしかなく、
   日足1銘柄で150KBほど使うため10枠しか置けなかった。
   ウォッチリストが160銘柄あるので、見直すたびにAPIを使い直していた。
   IndexedDBに移すことで枠を120に増やし、1日800回のAPI消費を大きく減らす。

   Safariのプライベートブラウズなどで IndexedDB が使えない環境もあるため、
   その時は従来の localStorage 方式に自動で戻る（動かなくならないように） */
const IDB_NAME='mychart', IDB_STORE='bars';
const IDX_KEY='mychart-cache-idx';    // 「どの枠がいつ保存されたか」だけの軽い目録
let idbPromise=null, idbBroken=false;

function idbOpen(){
  if(idbBroken) return Promise.resolve(null);
  if(idbPromise) return idbPromise;
  idbPromise=new Promise(resolve=>{
    let done=false;
    const fail=()=>{ if(!done){ done=true; idbBroken=true; resolve(null); } };
    try{
      if(!window.indexedDB) return fail();
      const req=indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded=()=>{ try{
        const db=req.result;
        if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      }catch(e){} };
      req.onsuccess=()=>{ if(!done){ done=true; resolve(req.result); } };
      req.onerror=fail; req.onblocked=fail;
      setTimeout(fail, 4000);      // 応答が返らない時は諦めて従来方式へ
    }catch(e){ fail(); }
  });
  return idbPromise;
}
// IndexedDBの読み書きは、失敗しても必ず null / false で返る形にそろえる
function idbRun(mode, fn){
  return idbOpen().then(db=>{
    if(!db) return null;
    return new Promise(resolve=>{
      try{
        const tx=db.transaction(IDB_STORE, mode), st=tx.objectStore(IDB_STORE);
        const r=fn(st);
        tx.oncomplete=()=>resolve(r ? r.result : true);
        tx.onerror=()=>resolve(null); tx.onabort=()=>resolve(null);
      }catch(e){ resolve(null); }
    });
  }).catch(()=>null);
}
const idbGet  = k     => idbRun('readonly',  st=>st.get(k));
const idbSet  = (k,v) => idbRun('readwrite', st=>{ st.put(v,k); return null; }).then(r=>r!==null);
const idbDel  = k     => idbRun('readwrite', st=>{ st.delete(k); return null; });
const idbKeys = ()    => idbRun('readonly',  st=>st.getAllKeys());

function idxLoad(){ const v=store.get(IDX_KEY, {}); return (v && typeof v==='object') ? v : {}; }

/* 保存・整理は「必ず1件ずつ順番に」行う。
   同時に走らせると、目録(IDX_KEY)の読み→書きが競合して記録が消え、
   目録に載っていない枠が「一番古いもの」と誤判定されて、
   いま保存したばかりの銘柄が整理で消される、という不具合が起きた */
let idbChain=Promise.resolve();
function idbQueue(fn){
  idbChain = idbChain.then(fn).catch(()=>{});
  return idbChain;
}

/* 枠が増えすぎたら整理する（設計ルール③：キャッシュには必ず上限）。
   ①期限切れを先に捨てる ②それでも多ければ古い順 という順番は従来と同じ */
async function idbPrune(){
  const keys=await idbKeys();
  if(!keys || keys.length<=DISK_MAX) return;
  const idx=idxLoad(), now=Date.now(), alive=[];
  for(const k of keys){
    const at=idx[k]||0;
    const ttl=String(k).endsWith('@65m') ? TTL_INTRA : TTL_DAILY;
    if(now-at>ttl){ await idbDel(k); delete idx[k]; }
    else alive.push(k);
  }
  if(alive.length>DISK_MAX){
    alive.sort((a,b)=>(idx[a]||0)-(idx[b]||0));
    for(let i=0;i<alive.length-DISK_MAX;i++){ await idbDel(alive[i]); delete idx[alive[i]]; }
  }
  store.set(IDX_KEY, idx);
}

/* ---- 従来の localStorage 方式（IndexedDBが使えない時の受け皿 兼 引っ越し元） ---- */
function lsLoad(){
  if(diskMem) return diskMem;
  try{ diskMem=JSON.parse(localStorage.getItem(DISK_KEY)||'{}'); }catch(e){ diskMem={}; }
  return diskMem;
}
function lsSave(obj){
  diskMem=obj;
  try{ localStorage.setItem(DISK_KEY, JSON.stringify(obj)); }
  catch(e){   // 容量オーバー時は古いものから捨てて再挑戦
    const keys=Object.keys(obj).sort((a,b)=>(obj[a].at||0)-(obj[b].at||0));
    for(let i=0;i<Math.ceil(keys.length/2);i++) delete obj[keys[i]];
    try{ localStorage.setItem(DISK_KEY, JSON.stringify(obj)); }catch(e2){}
  }
}
function lsPutRec(k, rec){
  const d=lsLoad();
  d[k]=rec;
  if(Object.keys(d).length>LS_MAX){
    const now=Date.now();
    Object.keys(d).forEach(x=>{
      if(x===k) return;
      const ttl = x.endsWith('@65m') ? TTL_INTRA : TTL_DAILY;
      if(now-(d[x].at||0) > ttl) delete d[x];
    });
    const keys=Object.keys(d);
    if(keys.length>LS_MAX){
      keys.sort((a,b)=>(d[a].at||0)-(d[b].at||0));
      for(let i=0;i<keys.length-LS_MAX;i++) delete d[keys[i]];
    }
  }
  lsSave(d);
}

/* localStorage に残っている古い保存を、一度だけ IndexedDB へ引っ越す */
let migrated=false;
async function idbMigrate(){
  if(migrated) return; migrated=true;
  try{
    const old=lsLoad(), keys=Object.keys(old);
    if(!keys.length) return;
    const idx=idxLoad();
    let moved=0;
    for(const k of keys){ if(await idbSet(k, old[k])){ idx[k]=old[k].at||Date.now(); moved++; } }
    if(moved){
      store.set(IDX_KEY, idx);
      try{ localStorage.removeItem(DISK_KEY); }catch(e){}
      diskMem={};
    }
  }catch(e){}
}

/* ---- 外から使うのはこの2つ（どちらの方式かは中で吸収する） ---- */
function diskPut(ticker, kind, raw){
  const k=ticker+'@'+kind, rec={ at:Date.now(), z:packRows(raw) };
  return idbQueue(async ()=>{
    await idbMigrate();
    if(await idbSet(k, rec)){
      const idx=idxLoad(); idx[k]=rec.at;
      // 目録にも上限を設ける（設計ルール③）。
      // Safariが保存領域を勝手に消すと、実体の無い記録だけが残り続けるため
      const ik=Object.keys(idx);
      if(ik.length>DISK_MAX*3){
        ik.sort((a,b)=>(idx[a]||0)-(idx[b]||0));
        for(let n=0;n<ik.length-DISK_MAX*3;n++) delete idx[ik[n]];
      }
      store.set(IDX_KEY, idx);
      await idbPrune();
    }else{
      lsPutRec(k, rec);               // IndexedDBが使えない環境
    }
  });
}
/* 保存を読む。期限切れかどうかも一緒に返す。
   保存が壊れていても、チャートを止めずに「保存なし」として扱う
   （ここで例外が外へ出ると、取得の失敗としてサンプル表示に落ちてしまう） */
async function diskRead(ticker, kind){
  try{
    const k=ticker+'@'+kind;
    await idbMigrate();
    const rec = (await idbGet(k)) || lsLoad()[k];   // 引っ越し前のデータも読める
    if(!rec) return null;
    const rows = rec.z ? unpackRows(rec.z) : (rec.raw||null);   // 旧形式もそのまま読める
    if(!rows) return null;
    const ttl = kind==='65m' ? TTL_INTRA : TTL_DAILY;
    const at = rec.at||0;
    return { rows, at, fresh: (Date.now()-at) <= ttl };
  }catch(e){ return null; }
}
async function diskGet(ticker, kind){          // 期限内のものだけ返す（従来どおり）
  const r=await diskRead(ticker, kind);
  return (r && r.fresh) ? r.rows : null;
}

/* 裏でこっそり取り直す。
   無料枠は1分7回なので、新しい銘柄を続けて開くと最大60秒待たされる。
   「少し古い値でもすぐ見える」方が実用的なので、保存が期限切れでも
   まず表示してしまい、順番が回ってきたら取り直して差し替える */
const bgFetching={};
function bgRefresh(ticker, kind){
  const k=ticker+'@'+kind;
  if(bgFetching[k]) return;                     // 二重に取りにいかない
  bgFetching[k]=true;
  (async()=>{
    try{
      const raw=await fetchReal(ticker, kind);
      await diskPut(ticker, kind, raw);
      // メモリ上の古い版を捨てて、見ていれば描き直す
      Object.keys(realCache).forEach(x=>{ if(x.startsWith(ticker+'@')) delete realCache[x]; });
      if(current.ticker===ticker) render();
      else if(c2 && c2.ticker===ticker) render2();
    }catch(e){
      // 取り直せなくても、古いデータは表示されたままなので致命的ではない
    }finally{ delete bgFetching[k]; }
  })();
}
/* 指定した銘柄の保存を消す（「今すぐ最新に」で使う） */
function diskDropTicker(ticker){
  const pre=ticker+'@';
  return idbQueue(async ()=>{
    const keys=await idbKeys();
    if(keys){
      const idx=idxLoad();
      for(const k of keys){ if(String(k).startsWith(pre)){ await idbDel(k); delete idx[k]; } }
      store.set(IDX_KEY, idx);
    }
    const d=lsLoad(); let hit=false;
    Object.keys(d).forEach(k=>{ if(k.startsWith(pre)){ delete d[k]; hit=true; } });
    if(hit) lsSave(d);
  });
}

/* 日足の生データから、他の時間足を自分で作る（APIを使わない） */
function deriveFrom(dailyRaw, step){
  if(step==='1d') return dailyRaw;
  // 束ねる関数に渡せる形（datetime付き）に変換
  const rows=dailyRaw.candles.map((c,i)=>({
    datetime:String(c.time), open:c.open, high:c.high, low:c.low, close:c.close,
    volume: dailyRaw.volumes[i] ? dailyRaw.volumes[i].value : 0 }));
  if(step==='1w') return toWeeks(rows);
  if(step==='1M') return toMonths(rows,1);
  if(step==='3M') return toMonths(rows,3);
  if(step==='6M') return toMonths(rows,6);
  return dailyRaw;
}

/* データ取得の唯一の入口。
   65分足だけは専用に取り、それ以外は「日足1回」で全部まかなう */
/* メモリに置く銘柄数の上限。
   これが無いと、スワイプで銘柄を見るたびに溜まり続け、
   100銘柄ほどでSafariが重くなる／落ちることがある。
   捨てても端末の保存が受け止めるので、API回数は増えない */
const MEM_MAX_SYMBOLS=20;
let memOrder=[];                     // 使った順（古い順に捨てる）
function memTouch(ticker){
  memOrder=memOrder.filter(t=>t!==ticker);
  memOrder.push(ticker);
  let guard=memOrder.length+2;   // 保護対象ばかりで終わらなくなるのを防ぐ安全弁
  while(memOrder.length>MEM_MAX_SYMBOLS && guard-- > 0){
    const old=memOrder.shift();
    if(old===current.ticker || old===c2.ticker) { memOrder.push(old); continue; }  // 表示中は残す
    Object.keys(realCache).forEach(k=>{ if(k.startsWith(old+'@')) delete realCache[k]; });
  }
}

/* 保存が期限切れだった場合、その保存時刻を入れて返す（0なら最新）。
   呼び出し側は「◯分前のデータです」と出すのに使う */
async function loadData(ticker, step){
  const memKey=ticker+'@'+step;
  memTouch(ticker);
  if(realCache[memKey]) return realCache[memKey];

  const kind = step==='65m' ? '65m' : '1d';

  if(step==='65m'){
    const rec=await diskRead(ticker,'65m');
    let raw, staleAt=0;
    if(rec && rec.fresh){ raw=rec.rows; }
    else if(rec){ raw=rec.rows; staleAt=rec.at; bgRefresh(ticker,'65m'); }  // 古くてもまず出す
    else { raw=await fetchReal(ticker,'65m'); diskPut(ticker,'65m',raw); }
    const p=pack(raw); p._staleAt=staleAt;
    return realCache[memKey]=p;
  }

  // 日足を用意（端末の保存 → 無ければAPIで1回だけ取得）
  let daily=realCache[ticker+'@__daily'], staleAt=realCache[ticker+'@__staleAt']||0;
  if(!daily){
    const rec=await diskRead(ticker,'1d');
    if(rec && rec.fresh){ daily=rec.rows; staleAt=0; }
    else if(rec){ daily=rec.rows; staleAt=rec.at; bgRefresh(ticker,'1d'); }  // 古くてもまず出す
    else { daily=await fetchReal(ticker,'1d'); diskPut(ticker,'1d',daily); staleAt=0; }
    realCache[ticker+'@__daily']=daily;
    realCache[ticker+'@__staleAt']=staleAt;
  }
  const p=pack(deriveFrom(daily, step)); p._staleAt=staleAt;
  return realCache[memKey]=p;
}

/* 「◯分前」の文言 */
function ageText(at){
  const m=Math.max(0, Math.floor((Date.now()-at)/60000));
  if(m<60) return m+'分前';
  const h=Math.floor(m/60);
  return h<24 ? h+'時間前' : Math.floor(h/24)+'日前';
}

/* 実データのキャッシュ（APIの回数を節約） */
const realCache={};

/* =========================================================
   ④ チャート本体（部品が読み込めてから動かす）
   ========================================================= */
// 読み込み失敗時に、白画面ではなく理由を表示する
function showLoadError(){
  document.getElementById('chart').innerHTML =
    '<div style="padding:24px;color:#d1d4dc;font-size:14px;line-height:1.9">'
    + 'チャート部品を読み込めませんでした。<br>'
    + 'このプレビュー画面が外部ファイルの読み込みをブロックしている可能性があります。<br><br>'
    + '▶ Safariで直接開くか、GitHub Pagesに公開してから開くと表示されます。'
    + '</div>';
  document.getElementById('foot').textContent = '部品の読み込みに失敗（プレビュー制限の可能性）';
}
// 部品が用意できるまで最大3秒待ってから main() を実行
function whenReady(cb, tries){
  tries = (tries==null) ? 60 : tries;
  if(window.LightweightCharts && window.LightweightCharts.CandlestickSeries) cb();
  else if(tries<=0) showLoadError();
  else setTimeout(function(){ whenReady(cb, tries-1); }, 50);
}

function main(){
const chart=LightweightCharts.createChart(document.getElementById('chart'),{
  layout:{background:{color:'#0e1117'},textColor:'#d1d4dc'},
  grid:{vertLines:{color:'#1b212c'},horzLines:{color:'#1b212c'}},
  crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
  rightPriceScale:{borderColor:'#232a36'}, timeScale:{borderColor:'#232a36'},
});
// 枠線あり。ローソクを太くした(v22)ことで、輪郭が付いた方が
// TradingViewに近い見え方になり、実体とヒゲの境目も読みやすい
const candleSeries=chart.addSeries(LightweightCharts.CandlestickSeries,{
  upColor:'#26a69a',downColor:'#ef5350',wickUpColor:'#26a69a',wickDownColor:'#ef5350',
  borderVisible:true, borderUpColor:'#26a69a', borderDownColor:'#ef5350'});
paneScale(chart,0,candleSeries).applyOptions({scaleMargins:{top:0.08,bottom:0.08}});
/* 枠(pane)ごとの価格目盛りを、確実にその枠だけ取る。
   チャート部品の一部の版に「片方の枠の設定が全部の枠に及ぶ」不具合があり、
   そのままだと対数目盛りにした時に出来高まで対数になってしまう */
function paneScale(chartObj, paneIndex, series){
  try{
    const p=chartObj.panes()[paneIndex];
    if(p && typeof p.priceScale==='function'){ const sc=p.priceScale('right'); if(sc) return sc; }
  }catch(e){}
  return series.priceScale();     // 取れない場合は従来の方法
}

// 出来高は価格チャートに重ねず、下の別枠に置く（TradingViewと同じ構成）。
// 重ねると価格の表示領域が2割ほど食われ、ローソク足が小さく潰れてしまうため
const volumeSeries=chart.addSeries(LightweightCharts.HistogramSeries,
  {priceFormat:{type:'volume'}, priceScaleId:'right'}, 1);
paneScale(chart,1,volumeSeries).applyOptions({scaleMargins:{top:0.10,bottom:0}});
// 出来高の移動平均線（出来高と同じ目盛りに重ねる。期間は下のVOL_MA_LENで変えられる）
const VOL_MA_LEN = 20;
const volMASeries=chart.addSeries(LightweightCharts.LineSeries,
  { color:'#64b5f6', lineWidth:1, priceScaleId:'right', priceLineVisible:false, lastValueVisible:false }, 1);

/* =========================================================
   ⑤ 状態＆描画（実データ→ダメならサンプル）
   ========================================================= */
let current={ ticker:store.get('mychart-last', SYMBOLS[0].ticker), step:'1d' };
// 2画面目の銘柄。キャッシュの整理でも参照するので、ここで先に用意しておく
let c2 = { ticker: store.get('mychart-c2', 'SOXX') };
let favs=store.get('mychart-favs', []);
let lastCandle, lastVol, currentCandles=[], currentVols=[];
// 描画ツールの状態
let tool=null, drawColor='#f5c518', drawings=[], drag=null, uid=1, selected=null;
// 銘柄ごとの描画の保存場所（例: "NVDA" → その銘柄の線一覧。全時間足で共有）
let drawingsMap=store.get('mychart-drawings', {});
// 旧バージョンの保存（時間足ごと・日付文字列）を、新形式（銘柄ごと・秒数）に引き継ぐ
(function(){
  let changed=false; const out={};
  Object.keys(drawingsMap).forEach(k=>{
    const tick = k.includes('@') ? k.slice(0, k.indexOf('@')) : k;   // "NVDA@1d" → "NVDA"
    if(k.includes('@')) changed=true;
    const arr = drawingsMap[k]||[];
    arr.forEach(d=>{ ['a','b'].forEach(pt=>{
      if(d[pt] && typeof d[pt].t==='string'){ d[pt].t=toEpoch(d[pt].t); changed=true; }
    }); });
    out[tick]=(out[tick]||[]).concat(arr);
  });
  if(changed){ drawingsMap=out; store.set('mychart-drawings', drawingsMap); }
})();
const $=id=>document.getElementById(id);
const isFav=t=>favs.includes(t);

/* 描画の置き直しが必要かを判断するための目印。
   draw() から参照するので、draw() より前で宣言しておく
   （let は巻き上げされないため、後ろに置くと起動時に例外になる） */
let lastSyncKey='';
/* データを入れ替えた直後、何フレームぶん強制的に置き直すか。
   時間足を切り替えると、チャート側の表示範囲が実際に更新されるまで
   数フレーム遅れることがある。その間に線を置くと前の時間足の縮尺で
   計算され、画面の端に張り付いてしまうため、しばらく置き直し続ける */
let relayoutFrames=0;

function draw(d){
  candleSeries.setData(d.candles); volumeSeries.setData(d.vols);
  // 出来高の移動平均線を計算して重ねる
  const vma=ta.sma(d.vols.map(v=>v.value), VOL_MA_LEN);
  volMASeries.setData(d.candles.map((c,i)=>({time:c.time, value:vma[i]})).filter(x=>x.value!=null));
  currentCandles=d.candles;
  currentVols=d.vols;                          // ADL計算に使う出来高
  epochs=d.candles.map(c=>toEpoch(c.time));   // 各バーの時刻(秒数)一覧を作る
  // 価格軸と十字線の精度を、この銘柄の価格帯に合わせる（低位株対策）
  if(d.candles.length) applyPricePrecision(candleSeries, d.candles[d.candles.length-1].close);
  loadDrawings();               // この銘柄に保存してある線を読み込む（全時間足共通）
  applyIndicators();            // 自作インジも計算し直す
  // 65分足のときだけ、横軸に時刻も表示する
  chart.applyOptions({ timeScale:{ timeVisible: current.step==='65m', secondsVisible:false } });
  // 65分足の時刻はUTC(米国市場の時刻)で組み立てているので、表示もUTCに合わせる
  try{ chart.applyOptions({ localization:{ timeFormatter: current.step==='65m'
    ? (t)=>{ const dt=new Date(t*1000);
        return String(dt.getUTCMonth()+1)+'/'+dt.getUTCDate()+' '
             + String(dt.getUTCHours()).padStart(2,'0')+':'+String(dt.getUTCMinutes()).padStart(2,'0'); }
    : undefined } }); }catch(e){}
  layoutPanes();   // 枠の高さを配分（インジの枠が増えても崩れないように）
  // データが長い時は「直近250本」だけ表示して開始（左にスクロールすると過去までさかのぼれる）
  // データが長い時は「画面に収まる本数」だけ表示して開始（左にスクロールすると過去までさかのぼれる）
  const n=d.candles.length, show=initialBars($('chart'));
  if(n>show+20) chart.timeScale().setVisibleLogicalRange({from:n-show, to:n+3});
  else chart.timeScale().fitContent();
  lastCandle=d.candles[d.candles.length-1]||null; lastVol=d.vols[d.vols.length-1]||null;
  updateLegend(lastCandle,lastVol);
  redrawOverlay();

  /* 時間足を切り替えた直後は、チャート側の「表示範囲」がまだ前の時間足のまま
     （setVisibleLogicalRange は次の描画まで反映されない）。
     その状態で線の位置を計算すると、例えば日足→週足で
       x =（週足での位置 490.6 − 日足の左端 2440）× 15.2px ≒ −29,700px
     となり、線が画面の遥か左へ飛ぶ。実測でも端点が左端に張り付いていた。

     さらに syncLoop は「表示範囲が変わった時だけ」置き直す仕組みなので、
     一度ズレた状態で範囲の値が変わらないと、ズレたまま固定されてしまう。
     そこで、範囲が実際に更新されてから必ず1回は置き直す。
     lastSyncKey も空にして、次のループで確実に再計算させる */
  // 表示範囲がチャート側に反映されるまで数フレームかかることがあるため、
  // しばらくの間は毎フレーム必ず置き直す（1〜2回では間に合わない端末がある）
  relayoutFrames=20;
}
function setMode(mode, msg){
  const b=$('badge');
  if(mode==='real'){ b.textContent='リアル'; b.className='badge real'; $('foot').textContent='Twelve Dataの実データを表示中'; }
  else { b.textContent='サンプル'; b.className='badge sample';
    $('foot').innerHTML = msg ? `<span class="err">${escHtml(msg)}</span>` : 'サンプル表示中。⚙からAPIキーを入れると実データになります'; }
}

/* 読み込み中の覆いを出す/消す */
/* 読み込み中の覆い。
   保存から即座に出せる時まで覆うと一瞬ちらつくので、
   250ms 以上かかりそうな時だけ出す */
let loadTimer=null;
function setLoading(on, msg){
  clearTimeout(loadTimer);
  if(!on){ document.body.classList.remove('loading'); return; }
  loadTimer=setTimeout(()=>{
    const el=$('staleNote');
    if(el) el.textContent=msg||'読み込み中…';
    document.body.classList.add('loading');
  }, 250);
}

/* 描画の順番を守るための番号札。
   スワイプで素早く銘柄を変えた時、遅れて届いた古い応答で
   画面が上書きされる（銘柄名と中身がズレる）のを防ぐ */
let renderToken=0;
async function render(){
  const my=++renderToken;                    // この呼び出しの番号札
  const cacheKey=current.ticker+'@'+current.step;
  const ticker=current.ticker, step=current.step;
  $('hdrTicker').textContent=ticker;
  $('hdrFav').style.display=isFav(ticker)?'inline':'none';
  store.set('mychart-last', ticker);

  if(realCache[cacheKey]){
    setLoading(false);
    draw(realCache[cacheKey]); setMode('real');
    priceRemember(ticker, realCache[cacheKey].candles);
    return;
  }

  if(store.get('td-key','')){
    $('foot').textContent='読み込み中…';
    // 待っている間、前の銘柄のチャートを新しい銘柄だと誤読しないよう覆う
    setLoading(true, ticker+' を読み込み中…\n（表示中のチャートはまだ前の銘柄です）');
    try{
      const d=await loadData(ticker, step);
      if(my!==renderToken) return;           // ← 古い応答は捨てる（最新の表示を壊さない）
      draw(d); setMode('real');
      priceRemember(ticker, d.candles);      // 実データが取れた時だけ価格を記憶
      renderList();
      // 期限切れの保存を出した場合は、いつのデータかを必ず伝える。
      // 黙って古い値を見せるのは「架空の数字を出さない」方針に反する
      if(d._staleAt){
        $('foot').innerHTML='<span class="old">'+escHtml(ageText(d._staleAt))
          +'の保存データを表示中。順番が来たら最新に差し替えます</span>';
      }
    }catch(err){
      if(my!==renderToken) return;
      draw(sampleDataset(ticker, step));
      // 原因を決めつけない。
      // 以前は何が起きても「通信できませんでした（電波の状況をご確認ください）」と
      // 断定して赤字で出していたため、本当の原因（API上限など）が分からず、
      // 画面を見ても何を直せばよいか判断できなかった
      if(err.kind==='api')        setMode('sample','APIエラー: '+err.message+'（サンプル表示）');
      else if(err.kind==='nokey') setMode('sample');   // キー未設定はエラーではない
      else if(err && err.message) setMode('sample','取得に失敗しました: '+err.message+'（サンプル表示）');
      else                        setMode('sample','取得に失敗しました（通信状況をご確認ください）→ サンプル表示');
    }finally{
      // 覆いは必ず外す。
      // 途中で return する経路（古い応答の破棄）があるので finally に置く。
      // 自分が最新でない時は、新しい呼び出しが覆いを管理しているので触らない
      if(my===renderToken) setLoading(false);
    }
  } else {
    setLoading(false);
    draw(sampleDataset(ticker, step)); setMode('sample');
  }
}

/* 出来高の表示。以前は24億が「2436.26M」と4桁のMになって読みづらく、
   インジの値表示(fmtIndVal)が「2.44B」なのと食い違っていた。
   0が「0K」、999,999が「1000K」になる点も直す */
function fmtVol(n){
  if(n==null || !isFinite(n)) return '-';
  const a=Math.abs(n);
  if(a===0) return '0';
  if(a>=1e9) return (n/1e9).toFixed(2)+'B';
  if(a>=1e6) return (n/1e6).toFixed(2)+'M';
  if(a>=1000) return (n/1000).toFixed(1)+'K';
  return String(Math.round(n));
}

/* 起動時に表示する本数を、チャートの幅から決める。
   以前は端末に関係なく常に250本を詰め込んでいたため、iPhoneの幅(約330px)では
   ローソク1本あたり1.3pxしかなく、実体とヒゲが区別できない細さになっていた。
   TradingViewのiPhone表示は1本あたり約5pxなので、それに合わせる。
   BAR_PX を大きくするとローソクが太く（表示本数が減り）、小さくすると細くなる */
const BAR_PX = 5.5;
function initialBars(el){
  const w=(el||$('chart')).clientWidth || 360;
  return Math.max(30, Math.min(400, Math.round(w / BAR_PX)));
}
/* 枠の高さを配分する。
   0=価格 / 1=出来高 / 2以降=自作インジ。
   固定の割合だと、インジの枠が増えた時に入る隙間がなくなって崩れるため、
   枠の数に応じて配分し直す */
function layoutPanes(chartObj, el){
  const c=chartObj||chart, box=el||$('chart');
  try{
    const panes=c.panes();
    if(panes.length<2) return;
    const total=box.clientHeight;
    if(!total) return;
    const indCount=Math.max(0, panes.length-2);          // 自作インジの枠の数
    const volShare=0.22;
    const indShare=indCount ? Math.min(0.18, (1-volShare-0.35)/indCount) : 0;
    const priceShare=1 - volShare - indShare*indCount;
    panes[0].setHeight(Math.round(total*priceShare));
    panes[1].setHeight(Math.round(total*volShare));
    for(let i=2;i<panes.length;i++) panes[i].setHeight(Math.round(total*indShare));
  }catch(e){}
}

/* 価格の表示桁数を、その価格帯に合わせて自動で変える。
   低位株を小数2桁で丸めると 0.0234 も 0.0218 も「0.02」になり、
   損切りと利確の区別がつかなくなるため */
function priceDigits(p){
  const a=Math.abs(p||0);
  if(!a) return 2;                       // 0や未取得は通常の2桁
  return a>=1 ? 2 : a>=0.1 ? 3 : a>=0.01 ? 4 : 6;
}
function fmtPrice(p){ return (p==null||!isFinite(p)) ? '-' : p.toFixed(priceDigits(p)); }
/* 計算で出した価格を丸める。桁数を固定せず「有効数字8桁」で丸めるのがポイント。
   以前は小数4桁固定だったため、$0.001の銘柄で損切−7%が−10%に、
   利確+14%が+10%になり、リスクリワードが2.0のはずが1.0になっていた */
function roundPrice(p){ return isFinite(p) ? +Number(p).toPrecision(8) : p; }
/* チャート本体（価格軸・十字線）の精度も銘柄に合わせて変える */
const MIN_MOVE={2:0.01, 3:0.001, 4:0.0001, 6:0.000001};   // 計算で作ると誤差が出るため表で持つ
function applyPricePrecision(series, lastClose){
  const d=priceDigits(lastClose);
  try{ series.applyOptions({ priceFormat:{ type:'price', precision:d, minMove:MIN_MOVE[d] } }); }catch(e){}
}
/* 足の時刻を画面用に整える。65分足は時刻まで、それ以外は日付だけ */
function barLabel(t){
  try{
    if(typeof t==='number'){
      const d=new Date(t*1000);
      return (d.getUTCMonth()+1)+'/'+d.getUTCDate()+' '
        +String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
    }
    const p=String(t).slice(0,10).split('-');
    return p.length>=3 ? (+p[1])+'/'+(+p[2]) : String(t);
  }catch(e){ return String(t); }
}
/* 出来高を照合しやすい桁数で出す。
   以前は「2.85B」としか出ず、2,845〜2,855Mのどこか分からないため
   他サイトと突き合わせられなかった */
function fmtVolPrecise(n){
  if(n==null || !isFinite(n)) return '-';
  const a=Math.abs(n);
  if(a===0) return '0';
  if(a>=1e9) return (n/1e6).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'M';
  if(a>=1e6) return (n/1e6).toFixed(2)+'M';
  if(a>=1000) return (n/1000).toFixed(1)+'K';
  return String(Math.round(n));
}
function updateLegend(c,v){
  if(!c) return;
  $('lg-date').textContent=barLabel(c.time);
  $('lg-o').textContent=fmtPrice(c.open); $('lg-h').textContent=fmtPrice(c.high);
  $('lg-l').textContent=fmtPrice(c.low);  $('lg-c').textContent=fmtPrice(c.close);
  $('lg-vol').textContent=v?fmtVolPrecise(v.value):'-';
  // 「前日比」は“ひとつ前の足の終値”と比べるのが正しい。
  // （以前はその足の始値と比べていたため、TradingViewと数値が合わなかった）
  const i=currentCandles.findIndex(x=>x.time===c.time);
  const prev = i>0 ? currentCandles[i-1] : null;
  const base = (prev && prev.close) ? prev.close : c.open;
  const chg=(c.close-base)/base*100, el=$('lg-chg');
  el.textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%'; el.className=chg>=0?'up':'down';

  /* 一番新しい足は、取引終了直後だと出来高がまだ確定していないことがある。
     実際にある銘柄で、確定後の2割ほどしか入っていない例を確認した。
     「出来高が平均の2倍か」の判断を誤らせるため、疑わしい時は印を出す。
     直近20本の中央値の40%未満なら、まだ集計中の可能性が高い */
  let prov='';
  if(i===currentCandles.length-1 && v && currentVols && currentVols.length>=6){
    const past=[];
    for(let k=Math.max(0,i-20);k<i;k++) if(currentVols[k] && currentVols[k].value>0) past.push(currentVols[k].value);
    if(past.length>=5){
      past.sort((a,b)=>a-b);
      const med=past[Math.floor(past.length/2)];
      if(med>0 && v.value < med*0.4) prov='速報';
    }
  }
  let pe=$('lg-prov');
  if(prov){
    if(!pe){ pe=document.createElement('b'); pe.id='lg-prov'; $('lg-date-wrap').appendChild(pe); }
    pe.textContent='速報'; pe.title='この足の出来高はまだ集計中の可能性があります';
  }else if(pe){ pe.textContent=''; }

  updateIndValues(i);   // インジの値も、同じ足のものに合わせる
}
chart.subscribeCrosshairMove(p=>{
  if(!p.time){ updateLegend(lastCandle,lastVol); return; }
  updateLegend(p.seriesData.get(candleSeries), p.seriesData.get(volumeSeries));
});

/* =========================================================
   Pine風の計算道具箱「ta」
   自作インジの中で ta.ema(close, 40) のように使える。
   どれも「配列を受け取って、同じ長さの配列を返す」仕組み。
   値が計算できない最初の数本は null（何も表示しない）になる
   ========================================================= */
// fade(色, 濃さ) … 色を指定の濃さ(0=透明〜1=くっきり)にする
// '#rrggbb' でも 'rgba(...)' でも受け取れる。インジの色を一括で薄くするのに使う
function fade(color, alpha){
  const a=Math.max(0, Math.min(1, alpha==null?1:alpha));
  if(typeof color!=='string') return color;
  let m=color.match(/^#([0-9a-fA-F]{6})$/);
  if(m){ const n=parseInt(m[1],16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
  m=color.match(/^#([0-9a-fA-F]{3})$/);
  if(m){ const r=parseInt(m[1][0]+m[1][0],16),g=parseInt(m[1][1]+m[1][1],16),b=parseInt(m[1][2]+m[1][2],16);
    return `rgba(${r},${g},${b},${a})`; }
  m=color.match(/^rgba?\(([^)]+)\)/);
  if(m){ const p=m[1].split(',').map(x=>x.trim()); return `rgba(${p[0]},${p[1]},${p[2]},${a})`; }
  return color;
}

const ta = {
  /* 「まだ計算できない(null)」を安全に扱うための小道具 */
  _num(v){ return (v==null || !isFinite(v)) ? null : v; },
  /* 期間の指定を安全な整数に直す。
     0や負の数、小数、NaNが来ると計算結果がNaNだらけになり、
     チャートが崩れて原因も分からなくなるため、入口で守る */
  _len(n, def){
    const v=Math.floor(Number(n));
    if(!isFinite(v) || v<1) return def||1;
    return Math.min(v, 100000);
  },

  /* 単純移動平均（窓の中が全部そろった時だけ値を出す） */
  sma(src, len){
    len=ta._len(len,1);
    const out=new Array(src.length).fill(null);
    let sum=0, cnt=0;
    for(let i=0;i<src.length;i++){
      const v=ta._num(src[i]);
      if(v!=null){ sum+=v; cnt++; }
      const j=i-len;
      if(j>=0){ const w=ta._num(src[j]); if(w!=null){ sum-=w; cnt--; } }
      if(i>=len-1 && cnt===len) out[i]=sum/len;
    }
    return out;
  },
  /* 指数移動平均（計算できない所は飛ばして、値が来てから始める） */
  ema(src, len){
    len=ta._len(len,1);
    const out=new Array(src.length).fill(null); const k=2/(len+1); let prev=null;
    for(let i=0;i<src.length;i++){
      const v=ta._num(src[i]);
      if(v==null){ out[i]=null; continue; }
      prev = prev==null ? v : v*k + prev*(1-k);
      out[i]=prev;
    }
    return out;
  },
  /* 加重移動平均 */
  wma(src, len){
    len=ta._len(len,1);
    const out=new Array(src.length).fill(null); const denom=len*(len+1)/2;
    for(let i=len-1;i<src.length;i++){
      let sum=0, okAll=true;
      for(let j=0;j<len;j++){ const v=ta._num(src[i-j]); if(v==null){ okAll=false; break; } sum+=v*(len-j); }
      if(okAll) out[i]=sum/denom;
    }
    return out;
  },
  /* Wilder平均（RSIやATRの中で使う） */
  rma(src, len){
    len=ta._len(len,1);
    const out=new Array(src.length).fill(null); let prev=null;
    for(let i=0;i<src.length;i++){
      const v=ta._num(src[i]);
      if(v==null){ out[i]=null; continue; }
      prev = prev==null ? v : (prev*(len-1)+v)/len;
      out[i]=prev;
    }
    return out;
  },
  /* RSI
     注意：JavaScriptでは null を引き算すると 0 として扱われる。
     そのため ta.rsi(ta.sma(close,20),14) のような重ねがけをすると、
     移動平均の「まだ計算できない区間(null)」との差が幻の急騰として記録され、
     下降中なのにRSIが50付近を指す、という誤りが起きていた。
     値がそろっていない所は素直に null にして、rma側で飛ばしてもらう */
  rsi(src, len){
    len=ta._len(len,14);
    const n=src.length, gains=new Array(n).fill(null), losses=new Array(n).fill(null);
    for(let i=1;i<n;i++){
      const a=ta._num(src[i]), b=ta._num(src[i-1]);
      if(a==null || b==null) continue;          // どちらか欠けていたら計算しない
      const d=a-b; gains[i]=Math.max(d,0); losses[i]=Math.max(-d,0);
    }
    const ag=ta.rma(gains,len), al=ta.rma(losses,len);
    return src.map((_,i)=>{
      if(i===0 || ag[i]==null || al[i]==null) return null;
      return al[i]===0 ? 100 : 100 - 100/(1 + ag[i]/al[i]);
    });
  },
  /* 直近len本の最高値・最安値（有効な値が1つも無ければnull）
     以前は1本ごとに窓の中を全部見直していたため、期間200×2500本で
     50万回の比較が必要だった。窓から出入りする分だけを更新する方式にして、
     本数に比例する速さ（約100倍速）にしている */
  _extreme(src, len, isMax){
    len=ta._len(len,1);
    const n=src.length, out=new Array(n).fill(null);
    const dq=new Array(n); let head=0, tail=0;   // 候補の添字を強い順に並べる
    for(let i=0;i<n;i++){
      const v=ta._num(src[i]);
      if(v!=null){
        // 自分より弱い候補は、もう最大/最小になれないので捨てる
        while(tail>head){
          const w=ta._num(src[dq[tail-1]]);
          if(w==null || (isMax ? w<=v : w>=v)) tail--; else break;
        }
        dq[tail++]=i;
      }
      while(tail>head && dq[head]<=i-len) head++;   // 窓から出た分を捨てる
      // 本数がそろうまでは値を出さない（ta.sma と同じ助走の扱いにそろえる）。
      // 以前は1本目から値を返していたため、例えば「52週高値」がまだ52週ぶんの
      // データが無い左端でも表示され、sma と食い違っていた
      out[i]= (i>=len-1 && tail>head) ? ta._num(src[dq[head]]) : null;
    }
    return out;
  },
  highest(src, len){ return ta._extreme(src, len, true); },
  lowest(src, len){ return ta._extreme(src, len, false); },
  /* 累積合計 */
  cum(src){ let sum=0; return src.map(v=>{ const n=ta._num(v); if(n!=null) sum+=n; return sum; }); },
  /* n本前との差 */
  change(src, n=1){
    n=ta._len(n,1);
    return src.map((_,i)=>{
      if(i<n) return null;
      const a=ta._num(src[i]), b=ta._num(src[i-n]);
      return (a==null||b==null) ? null : a-b;
    });
  },
  /* n本前からの変化率(%) */
  roc(src, len=1){
    len=ta._len(len,1);
    return src.map((_,i)=>{
      if(i<len) return null;
      const a=ta._num(src[i]), b=ta._num(src[i-len]);
      return (a==null||b==null||b===0) ? null : (a-b)/b*100;
    });
  },
  /* 標準偏差（ボリンジャーバンドの材料） */
  stdev(src, len){
    len=ta._len(len,1);
    const out=new Array(src.length).fill(null);
    for(let i=len-1;i<src.length;i++){
      let sum=0, cnt=0;
      for(let j=i-len+1;j<=i;j++){ const v=ta._num(src[j]); if(v==null){ cnt=-1; break; } sum+=v; cnt++; }
      if(cnt!==len) continue;
      const mean=sum/len;
      let sq=0;
      for(let j=i-len+1;j<=i;j++) sq+=Math.pow(src[j]-mean,2);
      out[i]=Math.sqrt(sq/len);
    }
    return out;
  },
  /* ATR: 1本あたりの実質的な値動き幅の平均（ボラの物差し） */
  atr(high, low, close, len=14){
    len=ta._len(len,14);
    // rsiと同じ理由で、null をそのまま計算に混ぜない。
    // 以前は先頭が null だと 0 という「値動きゼロの足」が出来てしまい、
    // その後のATRが本来より小さく出ていた
    const tr=high.map((_,i)=>{
      const hi=ta._num(high[i]), lo=ta._num(low[i]);
      if(hi==null || lo==null) return null;
      const pc = i>0 ? ta._num(close[i-1]) : null;
      if(pc==null) return hi-lo;                 // 1本目、または前の終値が無い時
      return Math.max(hi-lo, Math.abs(hi-pc), Math.abs(lo-pc));
    });
    return ta.rma(tr, len);
  },
  /* aがbを上抜けた/下抜けた瞬間だけ true（どちらかが計算不能なら反応しない） */
  crossover(a,b){
    return a.map((_,i)=> i>0
      && ta._num(a[i-1])!=null && ta._num(b[i-1])!=null && ta._num(a[i])!=null && ta._num(b[i])!=null
      && a[i-1]<=b[i-1] && a[i]>b[i]);
  },
  crossunder(a,b){
    return a.map((_,i)=> i>0
      && ta._num(a[i-1])!=null && ta._num(b[i-1])!=null && ta._num(a[i])!=null && ta._num(b[i])!=null
      && a[i-1]>=b[i-1] && a[i]<b[i]);
  },
};


/* =========================================================
   自作インジケーター（Pine風のコードをアプリ内で書いて表示）
   書いたコードは端末に保存され、銘柄・時間足を変えても自動で再計算される
   ========================================================= */
let indicators = store.get('custom-inds', []);   // 保存済みの自作インジ一覧
let customSeries = [];                            // いま画面に出している線
let customMarkers = null;                         // いま画面に出している矢印
let editingId = null;                             // 編集中のインジのID

/* 新規作成のときに最初から入っているお手本コード */
const IND_TEMPLATE = `// ここにPine風のコードを書きます
// 材料: open, high, low, close, volume（すべて配列）
// 道具: ta.sma ta.ema ta.wma ta.rsi ta.highest ta.lowest
//       ta.cum ta.change ta.roc ta.stdev ta.atr(high,low,close,期間)
//       ta.crossover ta.crossunder
// 重ねがけOK: ta.sma(ta.rsi(close,14), 5) のように組み合わせられます
// 線を引く: plot(値, {color:'#色', width:太さ, style:'solid/dashed/dotted', pane:'sub'か'main'})
// 矢印: signal(条件, {shape:'up'か'down', text:'GC'})
// input('名前', 初期値) と書くと、⚙設定から変えられるようになります

// 例① 期間・色を⚙設定から変えられるEMA
const len = input('期間', 40);
const col = input('色', '#f5a623');
plot(ta.ema(close, len), { color: col, width: 2, pane: 'main' });

// 例② RSIを下の枠に（先頭の//を消すと動く）
// plot(ta.rsi(close, input('RSI期間', 14)), { color:'#e91e63', pane:'sub' });
`;

/* 1つのインジのコードを実行して、「引きたい線」と「出したい矢印」を集める */
function runIndicatorCode(ind){
  const plots=[], signals=[], inputs=[], tables=[], bgs=[];
  const openA=currentCandles.map(c=>c.open),  highA=currentCandles.map(c=>c.high);
  const lowA =currentCandles.map(c=>c.low),   closeA=currentCandles.map(c=>c.close);
  const volA =currentVols.map(v=>v.value);
  const plot  =(series,opt)=>plots.push({series, opt:opt||{}});
  const signal=(arr,opt)=>signals.push({arr, opt:opt||{}});
  // hbars(項目) … 価格帯別出来高のような「横棒の集まり」を価格チャートに描く
  //   項目: [{ pLow, pHigh, value, color }...] と { maxValue, widthPct }
  //   ※ pLow/pHigh はその横棒が占める価格の下端・上端。
  //     長らく説明が priceLow/priceHigh と書かれていたが実装は pLow/pHigh で、
  //     説明どおりに書くとエラーも出ずに何も描かれなかった。
  //     今は priceLow/priceHigh と書いても動くようにしてある
  const hbars =(bins,opt)=>plots.push({hbars:bins, opt:opt||{}});
  // hline(価格, opt) … 1本の水平線（POC線など）
  const hline =(price,opt)=>plots.push({hline:price, opt:opt||{}});
  // sym('XLK') … 別銘柄のローソク足を返す（Pineの request.security(別銘柄) 相当）
  /* 他の銘柄のデータを「今のチャートと同じ日付の並び」にそろえる。
     以前はその銘柄自身の並びをそのまま返していた。本数が1本でも違うと
     全体が横にズレるため、RS比較（銘柄 vs SPY）が
     「NVDAの今週」と「SPYの先週」を突き合わせる、といった状態になっていた。
     取引が無かった日や、上位足を下位足に重ねる時は直前の値を持ち越す。
     まだデータが無い期間は null（ta側が自動で計算対象から外す） */
  const alignToChart=(rows)=>{
    // 相手のデータを時刻順に前から見ていき、各足の時刻を「超えない直近の値」を使う。
    // 単純な日付一致だと、相手の銘柄にしか無い日（休場日のズレなど）を取りこぼすため、
    // 両方を時刻順に突き合わせる方式にしている
    const src=rows.slice().sort((a,b)=>toEpoch(a.time)-toEpoch(b.time));
    let j=0, last=null;
    return currentCandles.map(cur=>{
      const k=toEpoch(cur.time);
      while(j<src.length && toEpoch(src[j].time)<=k){ last=src[j]; j++; }
      return last
        ? { time:cur.time, open:last.open, high:last.high, low:last.low, close:last.close, volume:0 }
        : { time:cur.time, open:null, high:null, low:null, close:null, volume:0 };
    });
  };
  const sym =(ticker,step)=>{
    const st=step||current.step, key=ticker+'@'+st;
    const toArr=d=>d.candles.map(c=>({time:c.time, open:c.open, high:c.high, low:c.low, close:c.close, volume:0}));
    if(realCache[key]) return alignToChart(toArr(realCache[key]));
    if(!collectingInputs && store.get('td-key','') && !htfFetching[key] && canFetch(key)){
      htfFetching[key]=true;
      loadData(ticker, st).then(()=>{ htfFetching[key]=false; indDataNote=''; scheduleApplyIndicators(); })
        .catch(e=>{ htfFetching[key]=false; htfFailed[key]=Date.now(); trimMap(htfFailed,200);
          indDataNote=(e&&e.message)?String(e.message).slice(0,60):'取得失敗'; scheduleApplyIndicators(); });
    }
    if(!collectingInputs && store.get('td-key','')) indSampleFlag=true;
    return alignToChart(toArr(sampleDataset(ticker, st)));
  };
  // table(セル配列) … 右上にスコア表を出す。cells=[{row,col,text,color,bg}...]
  const table =(cells,opt)=>tables.push({cells, opt:opt||{}});
  // bg(条件配列, opt) … 条件がtrueの足の背景を色で塗る（Pineの bgcolor 相当）
  const bg =(arr,opt)=>bgs.push({arr, opt:opt||{}});
  // input('名前', 初期値) … ⚙設定画面から変えられる値。保存済みの値があればそれを使う
  const input=(name,def)=>{
    inputs.push({name, def});
    const p=ind.params||{};
    let v=(p[name]!==undefined) ? p[name] : def;
    if(typeof def==='number'){ v=Number(v); if(!isFinite(v)) v=def; }
    return v;
  };
  // toggle('名前', 初期ON/OFF) … 表示の切り替え。⚙にチェックボックスが出る
  const toggle=(name,def)=>{
    const d=(def!==false);   // 省略時はON
    inputs.push({name, def:d, isToggle:true});
    const p=ind.params||{};
    return (p[name]!==undefined) ? !!p[name] : d;
  };
  // 書いたコードを関数に変換して実行（open/close/ta/plot などを渡す）
  const fn=new Function('open','high','low','close','volume','ta','plot','signal','input','hbars','hline','htf','sym','table','bg','toggle','fade', ind.code);
  fn(openA, highA, lowA, closeA, volA, ta, plot, signal, input, hbars, hline, htf, sym, table, bg, toggle, fade);
  return {plots, signals, inputs, tables, bgs};
}

/* 表示中の自作インジを全部消す */
function clearCustom(){
  customSeries.forEach(s=>{ try{ chart.removeSeries(s); }catch(e){} });
  customSeries=[];
  if(customMarkers) customMarkers.setMarkers([]);
  // 自作インジ用の枠(3番目以降)を片付ける。
  // 消さずに残すと、ON/OFFを繰り返すたびに空の枠が増え続け、
  // 1枠あたりの高さがどんどん減って画面が固まったようになる
  try{
    const panes=chart.panes();
    for(let i=panes.length-1;i>=2;i--){ try{ chart.removePane(i); }catch(e){} }
  }catch(e){}
  indShapes=[]; if($('indOverlay')) drawIndShapes();
  if($('indTable')) drawIndTable([]);
}

/* ONになっている自作インジを全部計算して表示する */
// htf('3M') … 上位足のローソク足を返す（Pineの request.security 相当）
// 実データがあればそれ、無ければサンプル。実データは裏で取得して届き次第描き直す
const htfFetching={};
// 取得に失敗した組み合わせを覚えておく。
// これが無いと「失敗→再描画→また取得→失敗」を延々と繰り返し、
// インジを複数出した時に画面が固まる
/* 取得に失敗した組み合わせと、その時刻。
   永久に諦めると、例えばXLK(セクターETF)が一度失敗しただけで
   UT-ScreenのRS判定が全銘柄でサンプルのままになってしまう。
   かといって即座に再挑戦すると無限ループになるので、少し時間をおいて再挑戦する */
const htfFailed={};
const RETRY_AFTER=60000;   // 1分たてば再挑戦
function canFetch(key){
  const t=htfFailed[key];
  return !t || (Date.now()-t) > RETRY_AFTER;
}
// 記録が増えすぎたら古いものから捨てる（銘柄が多いと際限なく増えるため）
function trimMap(obj, max){
  const keys=Object.keys(obj);
  if(keys.length>max) keys.slice(0, keys.length-max).forEach(k=>delete obj[k]);
}
// このインジが「本物でないデータ」を使ったかの印（サンプル混入の警告に使う）
let indSampleFlag=false, indDataNote='';
/* ⚙設定画面は「コードの中の input() を集める」ためだけにインジを1回実行する。
   その実行で htf()/sym() が本物のデータを取りに行くと、設定を覗いただけで
   APIの回数を消費してしまうため、この間だけ取得を止める */
let collectingInputs=false;
function htf(step){
  const key=current.ticker+'@'+step;
  const toArr=d=>d.candles.map(c=>({time:c.time, open:c.open, high:c.high, low:c.low, close:c.close}));
  if(realCache[key]) return toArr(realCache[key]);
  if(!collectingInputs && store.get('td-key','') && !htfFetching[key] && canFetch(key)){
    htfFetching[key]=true;
    loadData(current.ticker, step)
      .then(()=>{ htfFetching[key]=false; indDataNote=''; scheduleApplyIndicators(); })
      .catch(e=>{ htfFetching[key]=false; htfFailed[key]=Date.now(); trimMap(htfFailed,200);   // しばらく置いて再挑戦
        indDataNote=(e&&e.message)?String(e.message).slice(0,60):'取得失敗'; scheduleApplyIndicators(); });
  }
  // APIキーがある＝本物を期待している時だけ「サンプル混入」を警告する
  if(!collectingInputs && store.get('td-key','')) indSampleFlag=true;
  return toArr(sampleDataset(current.ticker, step));
}

/* インジの再計算をまとめて行う。
   上位足や他銘柄の取得が次々に終わるたびに全部を計算し直すと、
   インジの本数だけ無駄に重くなるため、少し待ってから1回だけ実行する */
let applyTimer=null;
function scheduleApplyIndicators(){
  if(applyTimer) clearTimeout(applyTimer);
  applyTimer=setTimeout(()=>{ applyTimer=null; applyIndicators(); }, 120);
}

function applyIndicators(){
  clearCustom();
  if(!currentCandles.length){ renderChips(); return; }
  // 下の枠は「インジごとに専用の枠」を1つずつ割り当てる
  // （RSIとADLのように縮尺が違うもの同士が、同じ枠で潰れないように）
  let nextSub=2;          // 0=価格 / 1=出来高 / 2以降=自作インジ
  let markers=[];
  indShapes=[];
  const allTables=[];
  indicators.filter(x=>x.on).forEach(ind=>{
    try{
      indSampleFlag=false;   // このインジの計算前にリセット
      const {plots, signals, tables, bgs}=runIndicatorCode(ind);
      // 十字線を合わせた足の値を読めるように、線の中身を覚えておく
      // （TradingViewが銘柄名の横にインジの数値を出しているのと同じ考え方）
      ind._vals = plots.filter(p=>p.series).map(p=>({ color:p.opt.color||'#00bcd4', arr:p.series }));
      if(indSampleFlag) ind._sample=true; else delete ind._sample;
      if(tables && tables.length) allTables.push(...tables);
      if(bgs && bgs.length) bgs.forEach(b=>indShapes.push({type:'bg', arr:b.arr, color:b.opt.color||'rgba(156,39,176,0.18)'}));
      // このインジが下の枠を使うなら、専用の枠番号を1つ確保（線グラフのみが対象）
      const myPane = plots.some(p=>p.series && p.opt.pane!=='main') ? nextSub++ : 0;   // 1=出来高の枠なので2から
      plots.forEach(p=>{
        if(p.hbars){   // 価格帯別出来高の横棒
          indShapes.push({type:'hbars', bins:p.hbars, maxValue:p.opt.maxValue||Math.max(1,...p.hbars.map(b=>b.value)),
            widthPct:(p.opt.widthPct!=null?p.opt.widthPct:0.35)});
          return;
        }
        if(p.hline!=null){   // 水平線（POC・上位足終値など）
          indShapes.push({type:'hline', price:p.hline, color:p.opt.color||'#ef5350',
            width:p.opt.width||1.5, style:p.opt.style||'dashed', text:p.opt.text||''});
          return;
        }
        const s=chart.addSeries(LightweightCharts.LineSeries,
          { color:p.opt.color||'#00bcd4', lineWidth:p.opt.width||2,
            lineStyle: p.opt.style==='dashed' ? 2 : p.opt.style==='dotted' ? 1 : 0,
            priceLineVisible:false, lastValueVisible:false },
          p.opt.pane==='main' ? 0 : myPane);
        s.setData(currentCandles
          .map((c,i)=>({time:c.time, value:p.series[i]}))
          .filter(x=>x.value!=null && isFinite(x.value)));
        customSeries.push(s);
      });
      signals.forEach(sg=>{
        currentCandles.forEach((c,i)=>{
          if(sg.arr[i]) markers.push({
            time:c.time,
            position: sg.opt.shape==='down' ? 'aboveBar' : 'belowBar',
            color: sg.opt.color || (sg.opt.shape==='down' ? '#ef5350' : '#26a69a'),
            shape: sg.opt.shape==='down' ? 'arrowDown' : 'arrowUp',
            text: sg.opt.text||'' });
        });
      });
      delete ind._err;   // 正常に動いたのでエラー印を消す
    }catch(e){
      // コードに間違いがあっても止まらず、印を付けて下のバーに理由を出す
      ind._err=e.message; delete ind._vals;
