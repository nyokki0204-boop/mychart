      setFoot('インジ「'+ind.name+'」でエラー: '+e.message);
    }
  });
  markers.sort((a,b)=>toEpoch(a.time)-toEpoch(b.time));
  if(markers.length && !customMarkers) customMarkers=LightweightCharts.createSeriesMarkers(candleSeries, []);
  if(customMarkers) customMarkers.setMarkers(markers);
  drawIndShapes();   // 価格帯別出来高などの横棒を描く
  drawIndTable(allTables);   // スコア表を描く
  layoutPanes();     // インジの枠が増減したので高さを配り直す
  renderChips();   // エラー印も含めて、チップを最新の状態にする
}

// スコア表を右上に描く（最初のtable()だけ表示）
function drawIndTable(tables){
  const el=$('indTable'); if(!el) return;
  if(!tables || !tables.length){ el.style.display='none'; el.innerHTML=''; return; }
  const cells=tables[0].cells||[];
  let maxR=0, maxC=0;
  cells.forEach(c=>{ if(c.row>maxR)maxR=c.row; if(c.col>maxC)maxC=c.col; });
  const grid={};
  cells.forEach(c=>{ grid[c.row+','+c.col]=c; });
  let html='';
  for(let r=0;r<=maxR;r++){
    html+='<tr>';
    for(let col=0;col<=maxC;col++){
      const c=grid[r+','+col];
      if(c) html+='<td style="'+(c.bg?'background:'+c.bg+';':'')+(c.color?'color:'+c.color+';':'')+'">'+
        String(c.text==null?'':c.text).replace(/</g,'&lt;')+'</td>';
      else html+='<td></td>';
    }
    html+='</tr>';
  }
  el.innerHTML=html; el.style.display='table';
}

// hbars/hline を価格チャートに重ねて描く（縦ズームに追従。横棒は右端に固定）
let indShapes=[];
function drawIndShapes(){
  const svg=$('indOverlay'); if(!svg) return;
  const full=$('chart').clientWidth, h=$('chart').clientHeight;
  const w=plotAreaWidth();          // 価格ラベルに被らない幅
  svg.setAttribute('width',full); svg.setAttribute('height',h);
  syncClip();                       // 価格の枠の外へはみ出さないようにする
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const hlineList=[];
  indShapes.forEach(sh=>{
    if(sh.type==='bg'){
      // 条件がtrueの足を、縦の帯で塗る（連続する足はまとめて1本の帯に）
      const arr=sh.arr; let start=-1;
      const paint=(a,b)=>{
        const xa=Lx(a-0.5), xb=Lx(b+0.5);
        if(xa==null||xb==null) return;
        // 高さは価格の枠までに留める（出来高の枠まで塗ると見づらいため）
        svg.appendChild(el('rect',{x:Math.min(xa,xb), y:0, width:Math.abs(xb-xa),
          height:priceAreaHeight(), fill:sh.color, style:'pointer-events:none'}));
      };
      for(let k=0;k<arr.length;k++){
        if(arr[k] && start<0) start=k;
        if((!arr[k]||k===arr.length-1) && start>=0){ paint(start, arr[k]?k:k-1); start=-1; }
      }
      return;
    }
    if(sh.type==='hbars'){
      const maxV=sh.maxValue||1, maxW=w*(sh.widthPct||0.35);
      sh.bins.forEach(b=>{
        // pHigh/pLow が本来の名前。priceHigh/priceLow と書かれていても受け付ける
        const bHi = b.pHigh!=null ? b.pHigh : b.priceHigh;
        const bLo = b.pLow !=null ? b.pLow  : b.priceLow;
        const y1=candleSeries.priceToCoordinate(bHi), y2=candleSeries.priceToCoordinate(bLo);
        if(y1==null||y2==null) return;
        const bw=(b.value/maxV)*maxW;
        svg.appendChild(el('rect',{ x:w-bw, y:Math.min(y1,y2), width:Math.max(0,bw),
          height:Math.max(1,Math.abs(y2-y1)-1), fill:b.color, style:'pointer-events:none' }));
      });
    } else if(sh.type==='hline'){
      hlineList.push(sh);   // まとめて描くので、いったん集めておく
    }
  });
  drawGroupedHlines(svg, hlineList, w);
}

/* 水平線をまとめて描く。
   例えば7月時点では「前月・前四半期・前半期」の終値がどれも6月末で同じになるため、
   同じ場所に3本重なってラベルが読めなくなる。
   同じ価格の線は1本にまとめ、名前を「1M/3M/6M」のように連結して表示する */
function drawGroupedHlines(svg, list, w){
  if(!list || !list.length) return;
  const items=[];
  list.forEach(sh=>{
    const y=candleSeries.priceToCoordinate(sh.price);
    if(y!=null && isFinite(y)) items.push({sh, y});
  });
  if(!items.length) return;
  items.sort((a,b)=>a.y-b.y);
  // 縦に2px以内のものは「同じ価格」とみなしてまとめる
  const groups=[];
  items.forEach(it=>{
    const g=groups[groups.length-1];
    if(g && Math.abs(g.y-it.y)<=2) g.items.push(it);
    else groups.push({y:it.y, items:[it]});
  });
  groups.forEach(g=>{
    // 一番目立つ線（太いもの）を代表にする
    let rep=g.items[0].sh;
    g.items.forEach(it=>{ if((it.sh.width||1.5)>(rep.width||1.5)) rep=it.sh; });
    const dash = rep.style==='solid' ? 'none' : rep.style==='dotted' ? '2,5' : '8,5';
    svg.appendChild(el('line',{x1:0,y1:g.y,x2:w,y2:g.y,stroke:rep.color,
      'stroke-width':rep.width||1.5,'stroke-dasharray':dash,style:'pointer-events:none'}));
    const names=[...new Set(g.items.map(it=>it.sh.text||'').filter(Boolean))];
    g.label=(names.join('/')+' '+fmtPrice(rep.price)).trim();
    g.color=rep.color;
  });
  // ラベル同士が近すぎる時は、下にずらして重ならないようにする
  let lastY=-999;
  groups.forEach(g=>{
    let ly=g.y-4;
    if(ly-lastY<12) ly=lastY+12;
    lastY=ly;
    const t=el('text',{x:6,y:ly,fill:g.color,'font-size':10,'font-weight':'700',style:'pointer-events:none'});
    t.textContent=g.label; svg.appendChild(t);
  });
}

/* ---- チャート左上のチップ（名前タップ=表示/非表示、⚙=設定） ---- */
let chipsCollapsed = store.get('mychart-chips-collapsed', false);
/* 十字線の位置にあるインジの値を表示するための入れ物。
   TradingViewは銘柄名の横にインジの数値を並べるが、これまでは名前しか出ず、
   「今この線はいくつなのか」がチャートを目で追うしかなかった */
let chipValEls=[];
function fmtIndVal(v){
  if(v==null || !isFinite(v)) return '–';
  const a=Math.abs(v);
  if(a===0) return '0';
  // 出来高系は桁が大きく、そのまま出すと10桁になってチップからはみ出すため
  if(a>=1e9) return (v/1e9).toFixed(2)+'B';
  if(a>=1e6) return (v/1e6).toFixed(2)+'M';
  if(a>=1000) return v.toFixed(0);
  if(a>=1)    return v.toFixed(2);
  if(a>=0.01) return v.toFixed(3);
  return v.toFixed(5);
}
function updateIndValues(i){
  chipValEls.forEach(o=>{
    const v = (i!=null && i>=0 && i<o.arr.length) ? o.arr[i] : null;
    o.el.textContent = fmtIndVal(v);
  });
}
function renderChips(){
  const box=$('indChips'); if(!box) return;
  box.innerHTML='';
  chipValEls=[];
  box.classList.toggle('collapsed', chipsCollapsed);
  // 先頭の開閉ボタン（インジが1つも無い時は何も出さない）
  if(indicators.length){
    const btn=document.createElement('button'); btn.id='indToggleBtn';
    const onCount=indicators.filter(x=>x.on).length;
    // 折りたたみ中は「👁 インジ(表示中の数)」、展開中は「▾ 隠す」
    btn.textContent = chipsCollapsed ? ('👁 インジ '+onCount) : '▾ 隠す';
    btn.addEventListener('click', ()=>{
      chipsCollapsed=!chipsCollapsed;
      store.set('mychart-chips-collapsed', chipsCollapsed);
      renderChips();
    });
    box.appendChild(btn);
  }
  indicators.forEach(ind=>{
    const c=document.createElement('div');
    c.className='ichip'+(ind.on?'':' off')+(ind._err?' err':'')+((ind._sample&&ind.on)?' warn':'');
    if(ind._err) c.title=ind._err;
    else if(ind._sample) c.title='上位足/他銘柄が実データでないため、サンプルで計算しています'+(indDataNote?('：'+indDataNote):'');
    c.innerHTML=`<span>${escHtml(ind.name)}</span>${(ind._sample&&ind.on)?'<span class="g">⚠</span>':''}<span class="g" data-g="1">⚙</span>`;
    // 十字線を合わせた足の値を出す欄（ONで線があるインジだけ）
    if(ind.on && ind._vals && ind._vals.length){
      ind._vals.forEach(v=>{
        const sp=document.createElement('span');
        sp.className='ival'; sp.style.color=v.color; sp.textContent='–';
        c.appendChild(sp);
        chipValEls.push({ el:sp, arr:v.arr });
      });
    }
    c.addEventListener('click', e=>{
      if(e.target.dataset.g){ openIndSettings(ind); return; }   // ⚙=設定
      ind.on=!ind.on; saveInds(); applyIndicators();            // 名前タップ=ON/OFF
    });
    box.appendChild(c);
  });
}

/* ---- ⚙設定画面（コード内の input() を自動でフォームにする） ---- */
let settingsId=null;
function openIndSettings(ind){
  settingsId=ind.id;
  let inputs=[];
  collectingInputs=true;   // この実行ではAPIを使わない
  try{ inputs = runIndicatorCode(ind).inputs || []; }catch(e){ inputs=[]; }
  finally{ collectingInputs=false; }
  $('indParamTitle').textContent = ind.name + ' の設定';
  const box=$('indParamFields'); box.innerHTML='';
  if(!inputs.length){
    box.innerHTML='<div style="color:var(--muted); font-size:13px; padding:6px 0;">'
      +'設定できる項目がありません。コードの中で input(\'名前\', 初期値) を使うと、ここに欄が出ます。</div>';
  }
  inputs.forEach((inp, idx)=>{
    const cur=(ind.params && ind.params[inp.name]!==undefined) ? ind.params[inp.name] : inp.def;
    const row=document.createElement('div'); row.className='dsRow';
    if(inp.isToggle){
      // 表示ON/OFFのチェックボックス
      row.innerHTML=`<label>${escHtml(inp.name)}</label>`
        + `<input type="checkbox" data-i="${idx}" data-toggle="1" ${cur?'checked':''} style="flex:none; width:22px; height:22px;" />`;
      box.appendChild(row); return;
    }
    const isNum=(typeof inp.def==='number');
    const isColor=(typeof cur==='string' && /^#[0-9a-fA-F]{3,8}$/.test(cur));
    // 名前・値をそのまま埋めると、" や < を含む時に設定画面が崩れる
    row.innerHTML=`<label>${escHtml(inp.name)}</label>`
      + (isColor
        ? `<input type="color" data-i="${idx}" value="${escHtml(cur)}" />`
        : `<input type="${isNum?'number':'text'}" class="pfield" data-i="${idx}" value="${escHtml(cur)}" />`);
    box.appendChild(row);
  });
  box._inputs=inputs;
  // 画面を「設定」に切り替え
  $('indList').style.display='none'; $('indListBtns').style.display='none';
  $('indEditor').style.display='none'; $('indParams').style.display='flex';
  $('indBack').classList.add('open');
}
function backToIndList(){
  $('indParams').style.display='none'; $('indEditor').style.display='none';
  renderIndList(); $('indList').style.display='block'; $('indListBtns').style.display='flex';
}
$('ipBack').addEventListener('click', backToIndList);
$('ipCode').addEventListener('click', ()=>{
  const ind=indicators.find(x=>x.id===settingsId);
  if(ind){ $('indParams').style.display='none'; openIndEditor(ind); }
});
$('ipSave').addEventListener('click', ()=>{
  const ind=indicators.find(x=>x.id===settingsId);
  const inputs=$('indParamFields')._inputs||[];
  if(ind){
    ind.params=ind.params||{};
    $('indParamFields').querySelectorAll('[data-i]').forEach(f=>{
      const inp=inputs[+f.dataset.i]; if(!inp) return;
      if(f.dataset.toggle){ ind.params[inp.name] = f.checked; }   // チェックボックス=ON/OFF
      else if(typeof inp.def==='number'){
        // 欄を空にして保存すると 0 になり、期間0のような無理な設定が入ってしまう。
        // 空欄・数値でない時は、そのインジの初期値に戻す
        const v=Number(f.value);
        ind.params[inp.name] = (String(f.value).trim()==='' || !isFinite(v)) ? inp.def : v;
      }
      else ind.params[inp.name] = f.value;
    });
    saveInds(); applyIndicators();
  }
  backToIndList();
});

/* ---- 管理画面（一覧・新規作成・編集・ON/OFF・削除） ---- */
function saveInds(){
  // _err(エラーの印)は一時的なメモなので、保存には含めない
  store.set('custom-inds', indicators.map(ind=>{ const c={...ind}; delete c._err; delete c._sample; return c; }));
}
function openIndMgr(){
  renderIndList();
  $('indEditor').style.display='none';
  $('indList').style.display='block'; $('indListBtns').style.display='flex';
  $('indBack').classList.add('open');
}
function renderIndList(){
  const box=$('indList'); box.innerHTML='';
  if(!indicators.length){
    box.innerHTML='<div style="color:var(--muted);font-size:13px;padding:8px 0;">まだありません。「＋新規作成」から作れます（お手本コード入り）</div>';
    return;
  }
  indicators.forEach(ind=>{
    const row=document.createElement('div'); row.className='indRow';
    row.innerHTML=`
      <button class="chip ${ind.on?'active':''}" data-t="1">${ind.on?'ON':'OFF'}</button>
      <span class="nm">${ind.name}</span>
      <button class="chip mini" data-s="1">⚙</button>
      <button class="chip mini" data-e="1">✎</button>
      <button class="chip mini" data-d="1">×</button>`;
    row.addEventListener('click',e=>{
      const t=e.target;
      if(t.dataset.t){ ind.on=!ind.on; saveInds(); renderIndList(); applyIndicators(); }
      else if(t.dataset.s){ openIndSettings(ind); }
      else if(t.dataset.e){ openIndEditor(ind); }
      else if(t.dataset.d){ indicators=indicators.filter(x=>x.id!==ind.id); saveInds(); renderIndList(); applyIndicators(); }
    });
    box.appendChild(row);
  });
}
function openIndEditor(ind){
  $('indParams').style.display='none';
  editingId = ind ? ind.id : null;
  $('indName').value = ind ? ind.name : '';
  $('indCode').value = ind ? ind.code : IND_TEMPLATE;
  $('indList').style.display='none'; $('indListBtns').style.display='none';
  $('indEditor').style.display='flex';
}
$('indBtn').addEventListener('click', openIndMgr);
$('indClose').addEventListener('click', ()=>$('indBack').classList.remove('open'));
$('indNew').addEventListener('click', ()=>openIndEditor(null));
$('indCancel').addEventListener('click', ()=>{
  $('indEditor').style.display='none';
  renderIndList(); $('indList').style.display='block'; $('indListBtns').style.display='flex';
});
$('indSave').addEventListener('click', ()=>{
  const name=($('indName').value||'').trim()||'無題';
  const code=$('indCode').value;
  if(editingId){ const ind=indicators.find(x=>x.id===editingId); if(ind){ ind.name=name; ind.code=code; } }
  else indicators.push({ id:Date.now(), name, code, on:true });
  saveInds(); applyIndicators();
  $('indEditor').style.display='none';
  renderIndList(); $('indList').style.display='block'; $('indListBtns').style.display='flex';
});

/* =========================================================
   ⑦ 描画ツール（透明レイヤーで描くので後から動かせる）
   ・水平線：上下ドラッグで移動
   ・トレンド：両端の丸で長さ/角度を変更、線の真ん中で全体移動
   ・計測ボックス：四角で囲むと変化率%・値幅・本数を表示、角でリサイズ
   ========================================================= */

const svg = $('overlay');
const TS = ()=>chart.timeScale();
// 「何本目か(logical)」「価格」⇔ 画面ピクセル の変換
/* 「何本目か」→ 画面の横位置。
   チャート部品の logicalToCoordinate() は、表示範囲の外を指定すると
   端に丸めて返すことがある。そのため画面外にあるはずの描画が
   左端や右端に張り付いて、そこに節目があるように見えてしまっていた。

   そこで、表示範囲の両端だけを部品に計算させ（ここは必ず正確）、
   その2点から直線で外側へ延長する。こうすると画面外の点も
   正しく画面外の座標になり、端に張り付かない */
function Lx(l){
  const ts=TS();
  const n=epochs.length;
  let r=null;
  try{ r=ts.getVisibleLogicalRange(); }catch(e){}
  if(r && isFinite(r.from) && isFinite(r.to) && n>=2){
    // 校正に使う2点は「表示範囲の中」かつ「データの中」から選ぶ。
    // 表示範囲の端(r.from/r.to)はデータの外側にはみ出していることが多く
    // （右側の余白など）、そこを部品に聞くと null が返ることがある。
    // その時に古い計算へ落ちると、画面外の描画が端に張り付いてしまう。
    // スワイプで線が画面外へ出た瞬間に左端に貼り付いていたのはこれが原因
    let a=Math.max(0, Math.ceil(r.from)), b=Math.min(n-1, Math.floor(r.to));
    if(b-a < 1){ a=0; b=n-1; }                    // 表示が狭すぎる時はデータ全体で校正
    if(b>a){
      const xa=ts.logicalToCoordinate(a), xb=ts.logicalToCoordinate(b);
      if(xa!=null && xb!=null && isFinite(xa) && isFinite(xb) && xb!==xa){
        const scale=(xb-xa)/(b-a);
        const x=xa+(l-a)*scale;
        if(isFinite(x)) return x;
      }
    }
  }
  const v=ts.logicalToCoordinate(l);
  return (v==null||!isFinite(v)) ? null : v;
}

/* 描画の位置がおかしい時に、原因を画面に出すための診断。
   推測ではなく実際の数値を見て直せるようにする */
let diagOnce=false;
function diagDrawing(){
  try{
    const d=drawings.find(x=>x && x.a && isFinite(x.a.t));
    if(!d) return;
    const ts=TS(); const r=ts.getVisibleLogicalRange();
    const la=tsToLogical(d.a.t), xa=tsToX(d.a.t);
    const n=epochs.length;
    const dt=t=>{ try{ return new Date(t*1000).toISOString().slice(0,10); }catch(e){ return String(t); } };
    setFoot('診断 '+current.step+' 足'+n+'本 範囲'
      +(r? (Math.round(r.from)+'〜'+Math.round(r.to)) : '不明')
      +' / 線A '+dt(d.a.t)+' → '+(la==null?'null':la.toFixed(1))+'本目 x='+(xa==null?'null':Math.round(xa))
      +' / データ '+dt(epochs[0])+'〜'+dt(epochs[n-1]));
  }catch(e){}
}
function Py(p){ return candleSeries.priceToCoordinate(p); }
function xToL(x){ return TS().coordinateToLogical(x); }
function yToP(y){ return candleSeries.coordinateToPrice(y); }

/* マグネット吸着：指の近くにローソク足の高値・安値・始値・終値があれば、
   そこにピタッと合わせる。
   iPhoneは指が太く、狙った値ちょうどを掴むのが難しい。節目のブレイクを
   見る手法だと、数ピクセルのズレがそのまま判断のズレになるため。
   MAGNET_PX 以内に何も無ければ、指の位置の値をそのまま使う */
let magnetOn = store.get('mychart-magnet', true);
const MAGNET_PX = 14;
function snapPrice(x, y){
  const raw=yToP(y);
  if(!magnetOn || raw==null || !currentCandles.length) return raw;
  const l=xToL(x); if(l==null) return raw;
  const i=Math.max(0, Math.min(currentCandles.length-1, Math.round(l)));
  const c=currentCandles[i]; if(!c) return raw;
  let best=null, bestD=MAGNET_PX;
  [c.high, c.low, c.open, c.close].forEach(p=>{
    const py=Py(p); if(py==null) return;
    const d=Math.abs(py-y);
    if(d<bestD){ bestD=d; best=p; }
  });
  return best!=null ? best : raw;
}

/* --- 線を「世界共通の時刻（エポック秒）」で覚えるための変換 ---
   日足の日付でも65分足の時刻でも、全部「秒数」に直して覚える。
   こうすると、どの時間足に切り替えても同じ値段・同じ時間の場所に線が出る */
let epochs=[];   // いま表示中の各ローソク足の時刻（秒数）一覧
function toEpoch(t){
  if(typeof t==='number') return t;
  // 日付文字列もUTCで解釈する。端末のタイムゾーンで解釈すると、
  // 65分足(UTCで組み立て)との間で最大1日ぶんズレてしまう
  const [y,m,d]=String(t).slice(0,10).split('-').map(Number);
  return Math.floor(Date.UTC(y,(m||1)-1,d||1)/1000);
}

// 時刻(秒) → 「何本目か」（小数もあり。データの外側でも延長線上で計算する）
/* 足の間隔がゼロだと割り算が Infinity になる。
   取得側で重複は除いているが、二重の保険としてここでも守る
   （Infinity を返すと、線が画面外へ飛んだり描画が壊れるため） */
function safeDiv(num, den){ return den ? num/den : 0; }
/* 時刻(秒) → 「何本目か」

   足に付いている時刻は「その期間の始まり」（週足なら月曜、月足なら1日）だが、
   画面ではその足の中央に描かれる。
   そのため、足の時刻どうしを単純に比例配分すると、期間の途中の時刻が
   次の足の位置まで押し出されてしまう。
   実測では、日足で 7/24 に引いた線が
     週足 → 57% 右へ / 月足 → 77% 右へ（ほぼ隣の足の位置）
   ずれていた。

   そこで「足 i の枠は logical i-0.5 〜 i+0.5」と考え、
   期間内の位置をその枠の中に収める。こうすると
   どの時間足で見ても、線は必ず“その時刻を含む足”の上に出る。
   logicalToTs はこの逆変換なので、指で動かした位置ともズレない */
function tsToLogical(ts){
  const e=epochs, n=e.length-1; if(n<1) return null;
  if(ts<e[0])  return -0.5 + safeDiv(ts-e[0], e[1]-e[0]);
  if(ts>=e[n]) return n-0.5 + safeDiv(ts-e[n], e[n]-e[n-1]);
  let lo=0, hi=n;
  while(hi-lo>1){ const mid=(lo+hi)>>1; if(e[mid]<=ts) lo=mid; else hi=mid; }
  return lo-0.5 + safeDiv(ts-e[lo], e[hi]-e[lo]);
}
// 「何本目か」→ 時刻(秒)（上の逆変換）
function logicalToTs(l){
  const e=epochs, n=e.length-1; if(n<1) return null;
  const j=l+0.5;                       // tsToLogical の逆（枠の左端を基準にそろえる）
  if(j<0)  return e[0]+j*(e[1]-e[0]);
  if(j>=n) return e[n]+(j-n)*(e[n]-e[n-1]);
  const i=Math.floor(j); return e[i]+(j-i)*(e[i+1]-e[i]);
}
// 画面の横位置 ⇔ 時刻(秒)
function xToTs(x){ const l=xToL(x); if(l==null) return null; const ts=logicalToTs(l); return ts==null?null:Math.round(ts); }
function tsToX(ts){ const l=tsToLogical(ts); return l==null?null:Lx(l); }

/* 描画の「元に戻す」用の履歴（直近20手ぶん）
   消す・動かす・追加する の直前の状態を控えておく */
let undoStack=[];
let dragUndoSnapshot=null, dragMoved=false;   // ドラッグ中の記録用
function pushUndo(){
  try{ undoStack.push(JSON.stringify(drawings.map(d=>{ const c={...d}; delete c._vp; return c; }))); }catch(e){ return; }
  if(undoStack.length>20) undoStack.shift();
}
/* 描画の通し番号(id)を、必ず「銘柄の中で重複しない」状態に直す。
   旧バージョンは線を「銘柄@時間足」ごとに保存していて、それぞれ id が 1 から
   振られていた。今の版はこれを銘柄ごとに統合するが、振り直しをしていなかったため
   同じ id の線が複数でき、次の3つが同時に起きていた：
     ・部品の対応表(elMap)が上書きされ、線が表示されない
     ・タップしても常に最初の1本が選ばれる（他は選べない）
     ・「選択を削除」で同じidの線がまとめて消える
   戻り値 true = 直した（呼び出し側で保存する） */
function normalizeIds(list){
  const seen=new Set(); let repaired=false;
  list.forEach(d=>{
    if(!d.id || seen.has(d.id)){ d.id=uid++; repaired=true; }
    seen.add(d.id);
    uid=Math.max(uid, d.id+1);
  });
  return repaired;
}

function doUndo(){
  if(!undoStack.length){ setFoot('戻せる操作がありません'); return; }
  try{
    drawings=JSON.parse(undoStack.pop());
    normalizeIds(drawings);
    selected=null; hideDelBtn(); saveDrawings(); redrawOverlay();
    setFoot('元に戻しました（残り'+undoStack.length+'手）');
  }catch(e){ setFoot('戻せませんでした'); }
}

/* --- 銘柄ごとの保存・読み込み（全時間足で共有） --- */
function dKey(){ return current.ticker; }
function saveDrawings(){
  // _vp(価格帯別出来高の集計キャッシュ)は使い回し用のメモなので、保存には含めない
  drawingsMap[dKey()]=drawings.map(d=>{ const c={...d}; delete c._vp; return c; });
  store.set('mychart-drawings', drawingsMap);
}
function loadDrawings(){
  undoStack=[];               // 銘柄が変わったら履歴もリセット
  drawings = drawingsMap[dKey()] || [];
  // 重複を見つけたら振り直し、その場で保存して二度と起きないようにする
  if(normalizeIds(drawings)) saveDrawings();
  selected=null; hideDelBtn();
}
function showDelBtn(){
  $('delOneBtn').style.display='inline-block'; $('styleBtn').style.display='inline-block';
  // ツールの段を隠している時に線をタップすると「線の設定」「選択を削除」が
  // 見えない場所に出てしまうので、その時だけ自動で開く
  try{ if(!toolsOpen) setToolsOpen(true); }catch(e){}
}
function hideDelBtn(){ $('delOneBtn').style.display='none'; $('styleBtn').style.display='none'; }
// 指/マウスの位置を、チャート左上からのピクセルに直す
function pos(e){ const r=svg.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
// SVG部品を作る小道具
function el(tag, a){ const n=document.createElementNS('http://www.w3.org/2000/svg',tag); for(const k in a) n.setAttribute(k,a[k]); return n; }

/* =========================================================
   図形の描画は「作る(build)」と「動かす(layout)」を分ける
   重要：ドラッグ中に部品を作り直すと、指が触れている部品ごと
   消えてしまい、iPhoneが「触っていた物が消えた」と判断して
   ドラッグを打ち切り、残りの指の動きがスクロールになってしまう。
   → 作り直すのは図形が増減した時だけ。ドラッグ中は位置だけ動かす
   ========================================================= */
let elMap={};   // 図形ID → その図形の画面部品セット

/* 重ねレイヤーを「価格の枠の中だけ」に切り抜く。
   priceToCoordinate() は表示範囲の外の価格でも座標を返すため、
   範囲外の水平線（例: 月足の終値ライン）が下の出来高の枠まで
   はみ出して描かれ、出来高チャートの上に線とラベルが乗っていた。
   描画ツールもインジの線も、もともと価格の枠専用なので全体を切り抜いてよい */
function syncClip(){
  const total=$('chart').clientHeight, ph=priceAreaHeight();
  const cut=Math.max(0, Math.round(total-ph));
  const v='inset(0px 0px '+cut+'px 0px)';
  [svg, $('indOverlay')].forEach(sv=>{
    if(!sv || sv.dataset.clip===v) return;
    sv.style.clipPath=v; sv.style.webkitClipPath=v;
    sv.dataset.clip=v;
  });
}
function syncSize(){
  const w=$('chart').clientWidth, h=$('chart').clientHeight;
  svg.setAttribute('width',w); svg.setAttribute('height',h);
  syncClip();
}
function setPos(node, attrs){ for(const k in attrs) node.setAttribute(k, attrs[k]); }
function showParts(parts, on){
  for(const k in parts){
    const v=parts[k];
    if(Array.isArray(v)){            // 出来高Pの棒24本や、折線の頂点のような「部品の束」
      v.forEach(n=>{ if(n&&n.setAttribute) n.setAttribute('visibility', on?'visible':'hidden'); });
    } else if(v && v.setAttribute){  // ふつうの部品1つ
      v.setAttribute('visibility', on?'visible':'hidden');
    }
  }
}

// 図形1つぶんの部品を作る（位置は layoutOne が決める）
function buildOne(d){
  const parts={};
  if(d.type==='hline'){
    // 掴むための透明な帯 → 見える線 → 価格ラベル
    parts.hit=el('line',{stroke:'transparent','stroke-width':28,'data-id':d.id,'data-role':'move',style:'pointer-events:all;cursor:ns-resize;touch-action:none'});
    parts.vis=el('line',{stroke:d.color,style:'pointer-events:none'});
    parts.txt=el('text',{x:6,fill:d.color,'font-size':11,style:'pointer-events:none'});
    svg.appendChild(parts.hit); svg.appendChild(parts.vis); svg.appendChild(parts.txt);
  } else if(d.type==='rect'){
    parts.body=el('rect',{fill:d.color,'fill-opacity':0.12,stroke:d.color,'data-id':d.id,'data-role':'body',style:'pointer-events:all;cursor:move;touch-action:none'});
    parts.txt=el('text',{fill:d.color,'font-size':11,'font-weight':'700',style:'pointer-events:none'});
    svg.appendChild(parts.body); svg.appendChild(parts.txt);
    addHandles(parts, d);
  } else if(d.type==='arrow'){
    // 矢印: 見えない丸=当たり判定、pathで矢印の形を描く
    parts.hit=el('circle',{r:18,fill:'transparent','data-id':d.id,'data-role':'move',style:'pointer-events:all;cursor:move;touch-action:none'});
    parts.vis=el('path',{fill:d.color,style:'pointer-events:none'});
    svg.appendChild(parts.hit); svg.appendChild(parts.vis);
  } else if(d.type==='poly'){
    // 折線: 1本のつながった線＋各頂点のハンドル
    parts.hit=el('polyline',{fill:'none',stroke:'transparent','stroke-width':28,'data-id':d.id,'data-role':'body',style:'pointer-events:all;cursor:move;touch-action:none'});
    parts.vis=el('polyline',{fill:'none',stroke:d.color,style:'pointer-events:none'});
    svg.appendChild(parts.hit); svg.appendChild(parts.vis);
    parts.vh=[]; parts.vv=[];
    d.pts.forEach((_,vi)=>{
      const h=el('circle',{r:14,fill:'transparent','data-id':d.id,'data-role':'v','data-vi':vi,style:'pointer-events:all;cursor:pointer;touch-action:none'});
      const v=el('circle',{r:6,fill:'#0e1117',stroke:d.color,'stroke-width':2,style:'pointer-events:none'});
      svg.appendChild(h); svg.appendChild(v);
      parts.vh.push(h); parts.vv.push(v);
    });
  } else if(d.type==='pos'){
    // 損益ツール: 緑=利確ゾーン / 赤=損切ゾーン / 3本の線(エントリー・利確・損切)
    parts.zoneT=el('rect',{fill:'#26a69a','fill-opacity':0.14,style:'pointer-events:none'});
    parts.zoneS=el('rect',{fill:'#ef5350','fill-opacity':0.14,style:'pointer-events:none'});
    svg.appendChild(parts.zoneT); svg.appendChild(parts.zoneS);
    parts.hitE=el('line',{stroke:'transparent','stroke-width':26,'data-id':d.id,'data-role':'body',style:'pointer-events:all;cursor:move;touch-action:none'});
    parts.visE=el('line',{stroke:d.color,'stroke-width':1.5,style:'pointer-events:none'});
    parts.hitT=el('line',{stroke:'transparent','stroke-width':24,'data-id':d.id,'data-role':'a',style:'pointer-events:all;cursor:ns-resize;touch-action:none'});
    parts.visT=el('line',{stroke:'#26a69a','stroke-width':1.5,'stroke-dasharray':'6,4',style:'pointer-events:none'});
    parts.hitS=el('line',{stroke:'transparent','stroke-width':24,'data-id':d.id,'data-role':'b',style:'pointer-events:all;cursor:ns-resize;touch-action:none'});
    parts.visS=el('line',{stroke:'#ef5350','stroke-width':1.5,'stroke-dasharray':'6,4',style:'pointer-events:none'});
    parts.txtT=el('text',{fill:'#26a69a','font-size':11,'font-weight':'700',style:'pointer-events:none'});
    parts.txtS=el('text',{fill:'#ef5350','font-size':11,'font-weight':'700',style:'pointer-events:none'});
    [parts.hitE,parts.visE,parts.hitT,parts.visT,parts.hitS,parts.visS,parts.txtT,parts.txtS].forEach(n=>svg.appendChild(n));
  } else if(d.type==='vp'){
    // 価格帯別出来高: 24本の横棒＋範囲の枠
    parts.bars=[];
    for(let k=0;k<24;k++){ const r=el('rect',{style:'pointer-events:none'}); svg.appendChild(r); parts.bars.push(r); }
    parts.frame=el('rect',{fill:'transparent',stroke:d.color,'stroke-width':1,'stroke-dasharray':'4,4','data-id':d.id,'data-role':'body',style:'pointer-events:all;cursor:move;touch-action:none'});
    svg.appendChild(parts.frame);
    addHandles(parts, d);
  } else { // trend
    parts.hit=el('line',{stroke:'transparent','stroke-width':28,'data-id':d.id,'data-role':'body',style:'pointer-events:all;cursor:move;touch-action:none'});
    parts.vis=el('line',{stroke:d.color,style:'pointer-events:none'});
    svg.appendChild(parts.hit); svg.appendChild(parts.vis);
    addHandles(parts, d);
  }
  elMap[d.id]=parts;
  layoutOne(d);
}
// 端点の丸ハンドル（見えない大きめの円=当たり判定 と 見た目の丸）
function addHandles(parts, d){
  parts.hitA=el('circle',{r:16,fill:'transparent','data-id':d.id,'data-role':'a',style:'pointer-events:all;cursor:pointer;touch-action:none'});
  parts.visA=el('circle',{r:8,fill:'#0e1117',stroke:d.color,'stroke-width':2,style:'pointer-events:none'});
  parts.hitB=el('circle',{r:16,fill:'transparent','data-id':d.id,'data-role':'b',style:'pointer-events:all;cursor:pointer;touch-action:none'});
  parts.visB=el('circle',{r:8,fill:'#0e1117',stroke:d.color,'stroke-width':2,style:'pointer-events:none'});
  svg.appendChild(parts.hitA); svg.appendChild(parts.visA);
  svg.appendChild(parts.hitB); svg.appendChild(parts.visB);
}

// 図形1つぶんの位置・見た目を最新にする（部品は消さない）
// 線種（実線/破線/点線）をSVGの点線パターンに変換する
function dashOf(st){ return st==='dashed' ? '8,5' : st==='dotted' ? '2,5' : 'none'; }

function layoutOne(d){
  const parts=elMap[d.id]; if(!parts) return;
  if(d.type==='hline'){
    const y=Py(d.price);
    if(y==null){ showParts(parts,false); return; }
    showParts(parts,true);
    const W=plotAreaWidth();
    setPos(parts.hit,{x1:0,y1:y,x2:W,y2:y});
    setPos(parts.vis,{x1:0,y1:y,x2:W,y2:y,'stroke-width':d.width||1.5,'stroke-dasharray':dashOf(d.style)});
    setPos(parts.txt,{y:y-4}); parts.txt.textContent=fmtPrice(d.price);
    return;
  }
  if(d.type==='arrow'){
    const x=tsToX(d.a.t), y=Py(d.a.p);
    if(x==null||y==null){ showParts(parts,false); return; }
    showParts(parts,true);
    setPos(parts.hit,{cx:x, cy:y});
    // 矢印の形（上向きは先端がタップ位置、下向きはその逆）
    const path = d.dir==='up'
      ? `M${x},${y} l-8,12 l5,0 l0,10 l6,0 l0,-10 l5,0 Z`
      : `M${x},${y} l-8,-12 l5,0 l0,-10 l6,0 l0,10 l5,0 Z`;
    setPos(parts.vis,{d:path, fill:d.color});
    return;
  }
  if(d.type==='poly'){
    const coords=d.pts.map(pt=>({x:tsToX(pt.t), y:Py(pt.p)}));
    if(coords.some(c=>c.x==null||c.y==null)){ showParts(parts,false); return; }
    showParts(parts,true);
    const ptsAttr=coords.map(c=>c.x+','+c.y).join(' ');
    setPos(parts.hit,{points:ptsAttr});
    setPos(parts.vis,{points:ptsAttr, stroke:d.color, 'stroke-width':d.width||2, 'stroke-dasharray':dashOf(d.style)});
    coords.forEach((c,vi)=>{
      if(parts.vh[vi]) setPos(parts.vh[vi],{cx:c.x, cy:c.y});
      if(parts.vv[vi]) setPos(parts.vv[vi],{cx:c.x, cy:c.y});
    });
    return;
  }
  if(d.type==='pos'){
    const x1=tsToX(d.a.t);
    const yE=Py(d.a.p), yT=Py(d.target), yS=Py(d.stop);
    if(x1==null||yE==null||yT==null||yS==null){ showParts(parts,false); return; }
    showParts(parts,true);
    const x2=plotAreaWidth();   // 価格ラベルの手前まで伸ばす
    setPos(parts.zoneT,{x:x1, y:Math.min(yE,yT), width:Math.max(0,x2-x1), height:Math.abs(yT-yE)});
    setPos(parts.zoneS,{x:x1, y:Math.min(yE,yS), width:Math.max(0,x2-x1), height:Math.abs(yS-yE)});
    setPos(parts.hitE,{x1, y1:yE, x2, y2:yE}); setPos(parts.visE,{x1, y1:yE, x2, y2:yE, stroke:d.color});
    setPos(parts.hitT,{x1, y1:yT, x2, y2:yT}); setPos(parts.visT,{x1, y1:yT, x2, y2:yT});
    setPos(parts.hitS,{x1, y1:yS, x2, y2:yS}); setPos(parts.visS,{x1, y1:yS, x2, y2:yS});
    // 利確%・損切%・リスクリワード比を表示
    const tp=(d.target-d.a.p)/d.a.p*100, sp=(d.stop-d.a.p)/d.a.p*100;
    const rr=Math.abs(d.a.p-d.stop)>0 ? Math.abs(d.target-d.a.p)/Math.abs(d.a.p-d.stop) : 0;
    setPos(parts.txtT,{x:x1+6, y:yT+(yT<yE?-5:14)});
    parts.txtT.textContent=(tp>=0?'+':'')+tp.toFixed(1)+'%（RR '+rr.toFixed(1)+'）';
    setPos(parts.txtS,{x:x1+6, y:yS+(yS>yE?14:-5)});
    parts.txtS.textContent=(sp>=0?'+':'')+sp.toFixed(1)+'%';
    return;
  }
  if(d.type==='vp'){
    const xa=tsToX(d.a.t), xb=tsToX(d.b.t);
    if(xa==null||xb==null){ showParts(parts,false); return; }
    // 期間内のデータから「どの価格帯にどれだけ出来高があるか」を集計（結果は覚えておいて使い回す）
    const key=d.a.t+'|'+d.b.t+'|'+dKey()+'@'+current.step+'|'+currentCandles.length;
    if(!d._vp || d._vp.key!==key){
      const n=currentCandles.length-1;
      let iA=Math.max(0, Math.min(n, Math.round(tsToLogical(d.a.t))));
      let iB=Math.max(0, Math.min(n, Math.round(tsToLogical(d.b.t))));
      if(iA>iB){ const tmp=iA; iA=iB; iB=tmp; }
      let lo=Infinity, hi=-Infinity;
      for(let i=iA;i<=iB;i++){ if(currentCandles[i].low<lo)lo=currentCandles[i].low; if(currentCandles[i].high>hi)hi=currentCandles[i].high; }
      const B=24, vols=new Array(B).fill(0);
      if(hi>lo){
        // その足の値幅（安値〜高値）にまたがる段へ、出来高を按分して分配する。
        // 以前は代表価格(HLC/3)の1段だけに全部入れていたため、
        // 値幅の広い足（ギャップやバイオ株の急騰）があると
        // 実際には取引があった価格帯が「出来高ゼロ」の空段になっていた。
        // 実測では24段のうち12段が空になり、POCも1.5%ずれていた。
        // TradingViewの価格帯別出来高と同じ考え方にそろえる。
        // 按分しても出来高の合計は変わらない
        for(let i=iA;i<=iB;i++){
          const c=currentCandles[i];
          const vol=(currentVols[i]?currentVols[i].value:0);
          if(!vol) continue;
          const kL=Math.max(0, Math.min(B-1, Math.floor((c.low -lo)/(hi-lo)*B)));
          const kH=Math.max(0, Math.min(B-1, Math.floor((c.high-lo)/(hi-lo)*B)));
          const share=vol/(kH-kL+1);
          for(let k=kL;k<=kH;k++) vols[k]+=share;
        }
      }
      const maxV=Math.max(...vols, 1);
      d._vp={ key, lo, hi, vols, maxV, poc:vols.indexOf(Math.max(...vols)) };
    }
    const v=d._vp;
    if(!(v.hi>v.lo)){ showParts(parts,false); return; }
    showParts(parts,true);
    const xL=Math.min(xa,xb), xR=Math.max(xa,xb), wAll=Math.max(1,xR-xL);
    const yTop=Py(v.hi), yBot=Py(v.lo);
    if(yTop==null||yBot==null){ showParts(parts,false); return; }
    setPos(parts.frame,{x:xL, y:Math.min(yTop,yBot), width:wAll, height:Math.abs(yBot-yTop), stroke:d.color});
    const B=v.vols.length;
    for(let k=0;k<B;k++){
      const pLo=v.lo+(v.hi-v.lo)*k/B, pHi=v.lo+(v.hi-v.lo)*(k+1)/B;
      const y1=Py(pHi), y2=Py(pLo);
      const w=(v.vols[k]/v.maxV)*wAll*0.95;
      setPos(parts.bars[k],{ x:xL, y:Math.min(y1,y2), width:Math.max(0,w), height:Math.max(1,Math.abs(y2-y1)-1),
        fill: k===v.poc ? 'rgba(245,166,35,0.55)' : 'rgba(100,181,246,0.35)' });
    }
    // ハンドルは枠の左右の中央に
    const yMid=(yTop+yBot)/2;
    setPos(parts.hitA,{cx:xa, cy:yMid}); setPos(parts.visA,{cx:xa, cy:yMid});
    setPos(parts.hitB,{cx:xb, cy:yMid}); setPos(parts.visB,{cx:xb, cy:yMid});
    return;
  }
  // 時刻や価格が壊れている図形は描かない（NaNのまま描くと画面の隅に張り付く）
  if(!isFinite(d.a.t)||!isFinite(d.b.t)||!isFinite(d.a.p)||!isFinite(d.b.p)){
    showParts(parts,false); return;
  }
  const x1=tsToX(d.a.t), y1=Py(d.a.p), x2=tsToX(d.b.t), y2=Py(d.b.p);
  if(x1==null||y1==null||x2==null||y2==null||!isFinite(x1)||!isFinite(x2)||!isFinite(y1)||!isFinite(y2)){
    showParts(parts,false); return;
  }
  showParts(parts,true);
  if(d.type==='rect'){
    const x=Math.min(x1,x2), y=Math.min(y1,y2), w=Math.abs(x2-x1), h=Math.abs(y2-y1);
    setPos(parts.body,{x,y,width:w,height:h,'stroke-width':d.width||1.5,'stroke-dasharray':dashOf(d.style)});
    setPos(parts.txt,{x:x+6,y:y+14});
    parts.txt.textContent=statsText(d.a, d.b);   // +3.2% / 値幅 / 本数
  } else {
    setPos(parts.hit,{x1,y1,x2,y2});
    setPos(parts.vis,{x1,y1,x2,y2,'stroke-width':d.width||2,'stroke-dasharray':dashOf(d.style)});
  }
  // 端点の丸は「画面の中にある時だけ」出す（TradingViewと同じ）。
  // 画面外の端点をそのまま置くと、丸が左端や上端に張り付いて
  // あたかもそこに節目があるように見えてしまう
  const W=plotAreaWidth(), Hh=priceAreaHeight(), M=20;
  const showHandle=(x,y)=> x>=-M && x<=W+M && y>=-M && y<=Hh+M;
  const putHandle=(hit,vis,x,y,on)=>{
    [hit,vis].forEach(n=>{ if(!n) return;
      n.setAttribute('visibility', on?'visible':'hidden');
      if(on) setPos(n,{cx:x,cy:y});
    });
  };
  putHandle(parts.hitA, parts.visA, x1, y1, showHandle(x1,y1));
  putHandle(parts.hitB, parts.visB, x2, y2, showHandle(x2,y2));
}

// 1点目の目印の位置を最新にする
function layoutPending(){
  const parts=elMap['pp']; if(!parts) return;
  const x=pendingPoint?tsToX(pendingPoint.t):null, y=pendingPoint?Py(pendingPoint.p):null;
  if(x==null||y==null){ showParts(parts,false); return; }
  showParts(parts,true);
  setPos(parts.dot,{cx:x,cy:y}); setPos(parts.ring,{cx:x,cy:y});
}

// 全部ゼロから作り直す（図形が増減した時だけ。ドラッグ中は呼ばない）
function redrawOverlay(){
  if(!svg) return;
  syncSize();
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  elMap={};
  drawings.forEach(d=>{ try{ buildOne(d); }catch(e){ setFoot('描画エラー('+d.type+'): '+e.message); } });
  if(creating){ try{ buildOne(creating); }catch(e){ setFoot('描画エラー: '+e.message); } }  // 引っぱっている最中のプレビュー
  if(pendingPoly && pendingPoly.length){       // 折線の作成途中（点と仮の線）
    const coords=pendingPoly.map(pt=>({x:tsToX(pt.t), y:Py(pt.p)})).filter(c=>c.x!=null&&c.y!=null);
    if(coords.length>1){
      svg.appendChild(el('polyline',{ points:coords.map(c=>c.x+','+c.y).join(' '),
        fill:'none', stroke:drawColor, 'stroke-width':2, 'stroke-dasharray':'5,4', style:'pointer-events:none' }));
    }
    coords.forEach(c=> svg.appendChild(el('circle',{cx:c.x, cy:c.y, r:5, fill:drawColor, style:'pointer-events:none'})));
  }
  if(pendingPoint){                            // タップ2回方式の「1点目」の目印
    const parts={};
    parts.dot=el('circle',{r:5,fill:drawColor,style:'pointer-events:none'});
    parts.ring=el('circle',{r:10,fill:'none',stroke:drawColor,'stroke-width':1.5,style:'pointer-events:none'});
    svg.appendChild(parts.dot); svg.appendChild(parts.ring);
    elMap['pp']=parts;
    layoutPending();
  }
}
// 位置だけ最新にする（ドラッグ中・チャートを動かした時はこちら）
function layoutOverlay(){
  if(!svg) return;
  syncSize();
  drawings.forEach(d=>{ try{ layoutOne(d); }catch(e){ setFoot('描画エラー('+d.type+'): '+e.message); } });
  if(creating){ try{ layoutOne(creating); }catch(e){ setFoot('描画エラー: '+e.message); } }
  layoutPending();
}

/* ---------------------------------------------------------
   新規作成：押したまま引っぱると、線がついてくる（離した所で確定）
   すぐ離した場合は「タップ2回」方式として1点目を覚えておく
   --------------------------------------------------------- */
let pendingPoint=null;                                   // タップ2回方式の1点目
let pendingPoly=null;                                    // 折線の作成途中の点たち
let creating=null, createStart=null, createMoved=false;  // 引っぱり中のプレビュー

// 計測の途中経過（+3.2% / 値幅 / 本数）を作る
function statsText(a,b){
  const pct=(b.p-a.p)/a.p*100, diff=b.p-a.p, bars=Math.round(Math.abs(tsToLogical(b.t)-tsToLogical(a.t)));
  return (pct>=0?'+':'')+pct.toFixed(2)+'% / '+(diff>=0?'+':'')+fmtPrice(Math.abs(diff))+' / '+bars+'本';
}
// 画面上の位置（クライアント座標）→ チャート左上からのピクセル
function chartXY(e){ const r=$('chart').getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
/* 価格チャート（上段）の高さ。
   出来高は下段の別枠になったので、そこをタップして線を作れてしまうと
   とんでもない価格に線が引かれる。上段の中だけを有効にする */
/* ローソク足が描かれている領域の幅（右側の価格ラベルの手前まで）。
   線をチャートの右端まで伸ばすと、価格ラベル(7.43など)の上に被って
   現在値が読めなくなるため、その手前で止める */
function plotAreaWidth(){
  const full=$('chart').clientWidth;
  try{
    const w=chart.priceScale('right').width();
    if(w>0 && w<full) return full-w;
  }catch(e){}
  return Math.max(0, full-60);   // 取れない場合の目安
}

function priceAreaHeight(){
  try{ const p=chart.panes()[0]; if(p && typeof p.getHeight==='function'){ const h=p.getHeight(); if(h>0) return h; } }catch(e){}
  return $('chart').clientHeight;
}

$('catcher').addEventListener('pointerdown', e=>{
  if(!tool) return;
  e.preventDefault(); // チャート側に触れさせない
  const {x,y}=chartXY(e);
  if(y>priceAreaHeight()){ setFoot('出来高の枠には描けません。上のローソク足の中でどうぞ'); return; }
  const price=snapPrice(x,y), t=xToTs(x);
  if(price==null||t==null){ setFoot('チャートの内側をタップしてください'); return; }

  if(tool==='hline'){
    // 押している間は上下に微調整でき、離した場所に置かれる
    creating={ id:0, type:'hline', color:drawColor, price };
    createStart={x,y}; createMoved=false;
    setFoot('価格 '+fmtPrice(price)+'（離すと確定）');
    redrawOverlay(); return;
  }
  if(tool==='au' || tool==='ad'){
    // 矢印: 押している間は位置を微調整でき、離した場所に置かれる
    creating={ id:0, type:'arrow', dir:(tool==='au'?'up':'down'), color:drawColor, a:{t, p:price} };
    createStart={x,y}; createMoved=false;
    redrawOverlay(); return;
  }
  if(tool==='pos'){
    // 損益ツール: タップした価格をエントリーとして、利確+14%/損切-7%の箱を作る
    creating={ id:0, type:'pos', color:drawColor, a:{t, p:price},
               target:roundPrice(price*1.14), stop:roundPrice(price*0.93) };
    createStart={x,y}; createMoved=false;
    setFoot('離すと確定（利確+14% / 損切-7%。後で端をドラッグして調整できます）');
    redrawOverlay(); return;
  }
  if(tool==='poly'){
    // 折線: タップするたびに点を追加。確定はツールボタンをもう一度押す
    pendingPoly=pendingPoly||[];
    pendingPoly.push({t, p:price});
    setFoot('点 '+pendingPoly.length+'個。「〰 折線」をもう一度押すと確定');
    redrawOverlay(); return;
  }
  if(pendingPoint){
    // 2点目：1点目とつないでプレビュー（動かして微調整→離して確定）
    creating={ id:0, type:tool, color:drawColor, a:pendingPoint, b:{t,p:price} };
    pendingPoint=null; createStart={x,y}; createMoved=true;
    setFoot(statsText(creating.a, creating.b));
    redrawOverlay(); return;
  }
  // 1点目：押したまま引っぱればそのまま描ける。すぐ離せばタップ2回方式
  creating={ id:0, type:tool, color:drawColor, a:{t,p:price}, b:{t,p:price} };
  createStart={x,y}; createMoved=false;
  redrawOverlay();
});

// 引っぱっている間：プレビューを更新し、下のバーに数値をリアルタイム表示
window.addEventListener('pointermove', e=>{
  if(!creating) return;
  const {x,y}=chartXY(e);
  if(createStart && Math.hypot(x-createStart.x, y-createStart.y)>10) createMoved=true;
  if(creating.type==='hline'){
    const pr=snapPrice(x,y); if(pr!=null){ creating.price=pr; setFoot('価格 '+fmtPrice(pr)+'（離すと確定）'); }
  } else if(creating.type==='arrow' || creating.type==='pos'){
    const t2=xToTs(x), pr=snapPrice(x,y);
    if(t2!=null&&pr!=null){
      creating.a={t:t2, p:pr};
      if(creating.type==='pos'){ creating.target=roundPrice(pr*1.14); creating.stop=roundPrice(pr*0.93); }
    }
  } else {
    const t=xToTs(x), pr=snapPrice(x,y);
    if(t!=null&&pr!=null){ creating.b={t,p:pr}; setFoot(statsText(creating.a, creating.b)); }
  }
  layoutOverlay();   // 位置だけ更新（作り直さない）
});

// 離した瞬間：確定（ほぼ動かしていなければ「タップ2回」の1点目として待つ）
window.addEventListener('pointerup', ()=>{
  if(!creating) return;
  const c=creating; creating=null; createStart=null;
  if(c.type==='hline' || c.type==='arrow' || c.type==='pos'){
    pushUndo();
    c.id=uid++; drawings.push(c); saveDrawings();
    setFoot(c.type==='hline' ? '水平線を追加（掴んで上下に動かせます）'
          : c.type==='arrow' ? '矢印を追加（掴んで動かせます）'
          : '損益ツールを追加（緑=利確 / 赤=損切。端をドラッグで調整）');
    setTool(null); redrawOverlay(); return;
  }
  if(!createMoved){
    pendingPoint=c.a;   // 1点目として記憶（目印の丸が出る）
    setFoot('もう1点タップ（引っぱってもOK）');
    redrawOverlay(); return;
  }
  if(c.a.t===c.b.t){ setFoot('もう少し横まで引っぱってください'); redrawOverlay(); return; }
  pushUndo();
  c.id=uid++; drawings.push(c); saveDrawings();
  setFoot((c.type==='rect'?'計測ボックス': c.type==='vp'?'価格帯別出来高':'トレンドライン')+'を追加（掴んで動かせます）');
  setTool(null); redrawOverlay();
});

// ---- 既存の線/枠を「掴んで動かす」操作（こちらは対象が小さいので従来通り） ----
// Safariの一部バージョンはSVG要素の setPointerCapture が不安定なため、
// 失敗しても止まらないように try/catch で囲む
function tryCapture(e){ try{ svg.setPointerCapture(e.pointerId); }catch(err){ /* 失敗しても続行 */ } }

svg.addEventListener('pointerdown', e=>{
  const t=e.target, id=t.getAttribute&&t.getAttribute('data-id'), role=t.getAttribute&&t.getAttribute('data-role');
  if(!id) return; // 既存の図形の上以外は、チャート自身の操作(パン等)に譲る
  const d=drawings.find(x=>x.id===+id); if(!d) return;
  // 動かす前の状態を控える（実際に動いた時だけ履歴に入れる。下のendPointer参照）
  dragUndoSnapshot=JSON.stringify(drawings.map(x=>{ const c={...x}; delete c._vp; return c; }));
  dragMoved=false;
  selected=d.id; showDelBtn();
  // 太さは変えず、下のバーの文字で「選択中」を知らせる
  const names={hline:'水平線', rect:'計測ボックス', trend:'トレンドライン', arrow:'矢印', poly:'折線', pos:'損益ツール', vp:'価格帯別出来高'};
  setFoot((d.type==='hline' ? '水平線 '+fmtPrice(d.price) : names[d.type]||'図形')
    + ' を選択中（「線の設定」「選択を削除」が使えます）');
  drag={ d, role, vi:+(t.getAttribute('data-vi')||-1),   // 折線のどの頂点を掴んだか
         start:pos(e), orig:JSON.parse(JSON.stringify(d)),
         la: d.a?tsToLogical(d.a.t):null, lb: d.b?tsToLogical(d.b.t):null,
         lpts: d.pts ? d.pts.map(pt=>tsToLogical(pt.t)) : null }; // 全体移動用に、今の位置（何本目か・小数）を控えておく
  tryCapture(e); e.preventDefault();
});
// 線に指が触れた瞬間に「これはスクロールではない」とiPhoneに宣言する。
// これが無いと、上下ドラッグ(特に水平線)をiPhoneがスクロールと誤解して
// ドラッグを途中で強制キャンセルし、画面ごと動いてしまう
svg.addEventListener('touchstart', e=>{
  const t=e.target;
  if(t && t.getAttribute && t.getAttribute('data-id')) e.preventDefault();
}, {passive:false});
// move/upは svg ではなく window で監視する
// → setPointerCapture が失敗しても、指がどこに動いてもドラッグを追跡できる
/* 指が少し揺れただけでは動かさない。
   iPhoneでは「タップ」でも必ず1〜3pxは動くため、しきい値が無いと
   線を選ぼうとしただけでドラッグ扱いになり、マグネット(14px)が働いて
   その時間足のOHLCへ勝手に吸着してしまう。
   結果、日足で引いた線を週足でタップしただけで値段が書き換わり、
   「時間足ごとに値段がズレる」ように見えていた */
const DRAG_MIN_PX = 7;
window.addEventListener('pointermove', e=>{
  if(!drag) return;
  const p=pos(e);
  if(!dragMoved){
    const dx=p.x-drag.start.x, dy=p.y-drag.start.y;
    if(Math.sqrt(dx*dx+dy*dy) < DRAG_MIN_PX) return;   // まだタップの範囲。何も変えない
    dragMoved=true;                                     // ここから本当のドラッグ
  }
  // 出来高の枠まで引っぱると、あり得ない価格に飛んでしまうので上段の中に留める
  const maxY=priceAreaHeight();
  if(p.y>maxY) p.y=maxY;
  if(p.y<0) p.y=0;
  const d=drag.d, o=drag.orig;
  if(d.type==='hline'){ const pr=snapPrice(p.x,p.y); if(pr!=null) d.price=pr; }
  else if(d.type==='arrow'){ // 矢印: そのまま移動
    const t=xToTs(p.x), pr=snapPrice(p.x,p.y); if(t!=null&&pr!=null) d.a={t, p:pr};
  }
  else if(d.type==='poly'){ // 折線: 頂点を1つ動かす or 全体を平行移動
    if(drag.role==='v' && drag.vi>=0){
      const t=xToTs(p.x), pr=snapPrice(p.x,p.y); if(t!=null&&pr!=null) d.pts[drag.vi]={t, p:pr};
    } else {
      const l1=xToL(drag.start.x), l2=xToL(p.x), dp=yToP(p.y)-yToP(drag.start.y);
      if(l1!=null&&l2!=null&&!isNaN(dp)&&drag.lpts){
        const dl=l2-l1;
        d.pts=drag.orig.pts.map((pt,k)=>{
          const ts=logicalToTs(drag.lpts[k]+dl);
          return ts==null ? pt : {t:Math.round(ts), p:pt.p+dp};
        });
      }
    }
  }
  else if(d.type==='pos'){ // 損益ツール: 緑端=利確 / 赤端=損切 / エントリー線=全体移動
    if(drag.role==='a'){ const pr=snapPrice(p.x,p.y); if(pr!=null) d.target=pr; }
    else if(drag.role==='b'){ const pr=snapPrice(p.x,p.y); if(pr!=null) d.stop=pr; }
    else {
      const l1=xToL(drag.start.x), l2=xToL(p.x), dp=yToP(p.y)-yToP(drag.start.y);
      if(l1!=null&&l2!=null&&!isNaN(dp)&&drag.la!=null){
        const ts=logicalToTs(drag.la+(l2-l1));
        if(ts!=null){ d.a={t:Math.round(ts), p:drag.orig.a.p+dp}; d.target=drag.orig.target+dp; d.stop=drag.orig.stop+dp; }
      }
    }
  }
  else if(drag.role==='a'){ const t=xToTs(p.x), pr=snapPrice(p.x,p.y); if(t!=null&&pr!=null) d.a={t, p:pr}; }
  else if(drag.role==='b'){ const t=xToTs(p.x), pr=snapPrice(p.x,p.y); if(t!=null&&pr!=null) d.b={t, p:pr}; }
  else { // body：全体を平行移動（小数単位でなめらかに動く）
    const l1=xToL(drag.start.x), l2=xToL(p.x);
    const dp=yToP(p.y)-yToP(drag.start.y);
    if(l1==null||l2==null||isNaN(dp)||drag.la==null||drag.lb==null) return;
    const dl=l2-l1;   // 何本ぶん動いたか（小数のまま）
    const ta=logicalToTs(drag.la+dl), tb=logicalToTs(drag.lb+dl);
    if(ta==null||tb==null) return;
    d.a={t:Math.round(ta), p:o.a.p+dp};
    d.b={t:Math.round(tb), p:o.b.p+dp};
  }
  layoutOverlay();   // 位置だけ更新（作り直さない）
});
function endPointer(){
  if(drag){
    // 実際に動かした時だけ履歴に残す（掴んで離しただけでは残さない）
    if(dragMoved && dragUndoSnapshot){
      undoStack.push(dragUndoSnapshot);
      if(undoStack.length>20) undoStack.shift();
    }
    saveDrawings();
  }
  dragUndoSnapshot=null; dragMoved=false;
  drag=null;
}

/* 描画シートをチャートと同じタイミングで動かす（ズーム時の遅れ対策）
   「表示範囲が変わったよ」という連絡を待つと半歩遅れるので、
   画面の更新ごと(毎フレーム)に「表示範囲が変わったか」を自分で確かめて、
   変わった時だけ位置を計算し直す。変わっていなければ何もしない（省エネ） */
// lastSyncKey は draw() より前（上の方）で宣言している
function viewKey(){
  const r=TS().getVisibleLogicalRange();
  const w=$('chart').clientWidth, h=$('chart').clientHeight;
  const py=lastCandle ? Py(lastCandle.close) : 0;   // 縦方向(価格の縮尺)の変化も拾う
  const ph=priceAreaHeight();                        // 価格の枠の高さ（インジ追加で変わる）
  return (r ? r.from+','+r.to : '-')+','+w+','+h+','+py+','+ph;
}
(function syncLoop(){
  if(drawings.length || creating || pendingPoint || (indShapes && indShapes.length)){
    if(relayoutFrames>0){
      relayoutFrames--;
      lastSyncKey=viewKey();
      try{ layoutOverlay(); drawIndShapes(); }catch(e){}
    }else{
      const k=viewKey();
      if(k!==lastSyncKey){ lastSyncKey=k; layoutOverlay(); drawIndShapes(); }
    }
  }else if(relayoutFrames>0){ relayoutFrames--; }
  requestAnimationFrame(syncLoop);
})();

/* 価格メモ … ウォッチリスト表示専用の軽い保存
   （銘柄→最新値と前日比だけ。160銘柄でも約8KBしか使わない）
   以前は未取得の銘柄ごとに20年分の架空データを作っていて、
   銘柄が増えるとウォッチリストを開くたびに数秒固まっていた */
const PRICES_KEY='mychart-prices';
const PRICES_MAX=400;          // 覚えておく銘柄数の上限（ウォッチリスト全体より十分多め）
let pricesMem=null;
function pricesLoad(){
  if(pricesMem) return pricesMem;
  try{ pricesMem=JSON.parse(localStorage.getItem(PRICES_KEY)||'{}'); }catch(e){ pricesMem={}; }
  return pricesMem;
}
function priceRemember(ticker, candles){
  if(!candles || candles.length<2) return;
  const last=candles[candles.length-1], prev=candles[candles.length-2];
  if(!prev.close) return;
  const p=pricesLoad();
  p[ticker]={ p:last.close, c:(last.close-prev.close)/prev.close*100, at:Date.now() };
  // 上限を設ける（設計ルール③）。1件50バイト程度なので余裕はあるが、
  // 銘柄を入れ替え続けると古い銘柄のメモが際限なく残り続けるため
  const keys=Object.keys(p);
  if(keys.length>PRICES_MAX){
    keys.sort((a,b)=>(p[a].at||0)-(p[b].at||0));
    for(let i=0;i<keys.length-PRICES_MAX;i++) delete p[keys[i]];
  }
  try{ localStorage.setItem(PRICES_KEY, JSON.stringify(p)); }catch(e){}
}
// 価格を返す。分からない場合は null（架空の数字は出さない）
function priceOf(ticker){
  const d=realCache[ticker+'@1d'];
  if(d && d.candles && d.candles.length>1){
    const c=d.candles, last=c[c.length-1], prev=c[c.length-2];
    return { price:last.close, chg:(last.close-prev.close)/prev.close*100 };
  }
  const m=pricesLoad()[ticker];
  return m ? { price:m.p, chg:m.c } : null;
}

/* リスト切り替えタブ（＋新規 / ✎名前変更 / 🗑削除） */
function renderTabs(){
  const tabs=$('listTabs'); tabs.innerHTML='';

      lists.push(L); activeListId=L.id;
      saveLists(); store.set('mychart-active-list',activeListId);
      renderTabs(); renderList();
    });
  });
  tabs.appendChild(add);
  // ✎ いま開いているリストの名前を変える
  const ren=document.createElement('button'); ren.className='chip mini'; ren.textContent='✎';
  ren.addEventListener('click',()=>{

      L.name=name.trim(); saveLists(); renderTabs();
    });
  });
  tabs.appendChild(ren);
  // 🗑 いま開いているリストを削除（1回目のタップで確認、もう一度タップで実行）
  if(lists.length>1){
    const del=document.createElement('button'); del.className='chip mini'; del.textContent='🗑';
    let armed=false;
    del.addEventListener('click',()=>{
      if(!armed){
        armed=true; del.textContent='削除する？'; del.style.color='#ef5350';
        setTimeout(()=>{ armed=false; if(del.isConnected){ del.textContent='🗑'; del.style.color=''; } }, 3000);
        return;
      }
      const L=activeList();
      // 消す前に今の状態を退避しておく。
      // 銘柄を何十件も入れたリストを誤って消すと作り直しが大変なため、
      // ⚙の「ひとつ前に戻す」で復旧できるようにする
      if(typeof saveUndo==='function') saveUndo();
      lists=lists.filter(x=>x.id!==L.id); activeListId=lists[0].id;
      saveLists(); store.set('mychart-active-list',activeListId);
      renderTabs(); renderList();
      setFoot('「'+L.name+'」を削除しました（⚙の「ひとつ前に戻す」で復旧できます）');
    });
    tabs.appendChild(del);
  }
}

/* 一覧の描画。
   銘柄が多いと行を一度に全部作る負担が大きいので、
   最初の40件だけ即座に出し、残りは少しずつ足す（画面が固まらない） */
let listRenderToken=0;
function renderList(){
  const list=$('list'); list.innerHTML='';
  const my=++listRenderToken;
  const tickers=activeList().tickers;
  if(!tickers.length){ list.appendChild(label('「＋追加」で銘柄を入れてください')); return; }
  const fav=tickers.filter(t=>isFav(t)), oth=tickers.filter(t=>!isFav(t));
  const items=[];
  if(fav.length){ items.push({label:'★ お気に入り'}); fav.forEach(t=>items.push({t})); items.push({label:'リストの銘柄'}); }
  oth.forEach(t=>items.push({t}));

  const CHUNK=40;
  let i=0;
  const step=()=>{
    if(my!==listRenderToken) return;          // 別の描画が始まっていたら中断
    const frag=document.createDocumentFragment();
    const end=Math.min(i+CHUNK, items.length);
    for(; i<end; i++){
      const it=items[i];
      frag.appendChild(it.label ? label(it.label) : rowEl(symInfo(it.t)));
    }
    list.appendChild(frag);
    if(i<items.length) requestAnimationFrame(step);   // 続きは次の描画タイミングで
  };
  step();
}
function label(t){ const d=document.createElement('div'); d.className='sec-label'; d.textContent=t; return d; }
function rowEl(s){
  const pr=priceOf(s.ticker);
  const row=document.createElement('div'); row.className='row'+(s.ticker===current.ticker?' active':'');
  row.innerHTML=`
    <div class="star ${isFav(s.ticker)?'on':''}" data-star="${s.ticker}">${isFav(s.ticker)?'★':'☆'}</div>
    <div><div class="tk">${s.ticker}</div><div class="nm">${s.name}</div></div>
    <div class="rt mono">${ pr
      ? `<div class="price">${fmtPrice(pr.price)}</div>
         <div class="chg ${pr.chg>=0?'up':'down'}">${pr.chg>=0?'+':''}${pr.chg.toFixed(2)}%</div>`
      : `<div class="price" style="opacity:.35" title="チャートを開くと価格を取得します">—</div>` }</div>
    <div class="del" data-move="${s.ticker}" title="別のリストへ移動">⇄</div>
    <div class="del" data-del="${s.ticker}">×</div>`;
  row.addEventListener('click',e=>{
    if(e.target.dataset.star){ toggleFav(s.ticker); return; }      // ☆をタップ→お気に入り
    if(e.target.dataset.move){ moveSymbol(s.ticker); return; }     // ⇄をタップ→別リストへ移動
    if(e.target.dataset.del){ removeSymbol(s.ticker); return; }    // ×をタップ→このリストから外す
    if(symbolTarget===2){ c2.ticker=s.ticker; render2(); closeDrawer(); return; }
    current.ticker=s.ticker; render(); renderList(); closeDrawer();
  });
  return row;
}
function toggleFav(t){ favs=isFav(t)?favs.filter(x=>x!==t):[...favs,t]; store.set('mychart-favs',favs);
  renderList(); $('hdrFav').style.display=isFav(current.ticker)?'inline':'none'; }

/* --- ティッカー検索（TradingViewの検索窓のような機能） --- */
// 入力を大文字だけに整える（AAPL, BRK.B などを許可）
function cleanTicker(v){ return (v||'').trim().toUpperCase().replace(/[^A-Z0-9.\-]/g,''); }
// カンマ区切りの入力を「銘柄の一覧」に分解する
// 例: "AAPL, NVDA，SOXX" → ["AAPL","NVDA","SOXX"]
// 半角カンマ・全角カンマ・読点・空白のどれで区切ってもOK。重複は自動で除く
function parseTickers(v){
  return (v||'').split(/[,、，\s]+/)
    .map(cleanTicker)
    .filter((t,i,arr)=> t && arr.indexOf(t)===i);
}
// 打った銘柄を表示するだけ（複数打った場合は最初の1つを表示）
function showTicker(v){
  const t=parseTickers(v)[0]; if(!t) return;
  if(symbolTarget===2){ c2.ticker=t; render2(); closeDrawer(); return; }
  current.ticker=t; render(); renderList(); closeDrawer();
}
// 打った銘柄を、いま開いているリストに保存して表示
// カンマ区切りならまとめて追加できる（TradingView風）
function addSymbol(v){
  const ts=parseTickers(v); if(!ts.length) return;
  const L=activeList();
  const added=[];
  ts.forEach(t=>{ if(!L.tickers.includes(t)){ L.tickers.push(t); added.push(t); } });
  if(added.length) saveLists();
  showTicker(ts[0]);   // 最初の銘柄をチャートに表示
  setFoot(added.length
    ? added.length+'銘柄を追加: '+added.join(', ')
    : 'すべて追加済みでした');
}
/* 銘柄を別のリストへ移動する（移動先を選ぶ画面を出す） */
function moveSymbol(t){
  const others=lists.filter(L=>L.id!==activeListId);
  if(!others.length){ setFoot('移動先のリストがありません（＋で作成してください）'); return; }
  const box=$('indList');   // 既存のモーダルを流用せず、簡易な選択を出す
  const names=others.map((L,i)=>(i+1)+'. '+L.name).join('\n');
  askText('「'+t+'」をどのリストへ移動しますか？\n番号を入力してください\n'+names, '1', v=>{
    const idx=parseInt(v,10)-1;
    if(isNaN(idx) || idx<0 || idx>=others.length){ setFoot('番号が正しくありません'); return; }
    const to=others[idx], from=activeList();
    from.tickers=from.tickers.filter(x=>x!==t);
    if(!to.tickers.includes(t)) to.tickers.push(t);
    saveLists(); renderList();
    setFoot(t+' を「'+to.name+'」へ移動しました');
  });
}

  L.tickers=L.tickers.filter(x=>x!==t); saveLists();

/* =========================================================
   2画面表示（TradingView風）
   1画面 → 上下2画面 → 左右2画面 の順にボタンで切り替え。
   2画面目は「比較用」で、ローソク足＋出来高を表示する。
   時間足は両方の画面で共通。銘柄はそれぞれ別に選べる
   ========================================================= */
let layoutMode = store.get('mychart-layout', '1');    // '1'=1画面 'v'=上下 'h'=左右
let chart2=null, candle2=null, volume2=null;

// 2画面目のチャートを（初めて必要になった時に）作る
function ensureChart2(){
  if(chart2) return;
  chart2=LightweightCharts.createChart($('chart2'),{
    layout:{background:{color:'#0e1117'},textColor:'#d1d4dc'},
    grid:{vertLines:{color:'#1b212c'},horzLines:{color:'#1b212c'}},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    rightPriceScale:{borderColor:'#232a36'}, timeScale:{borderColor:'#232a36'},
  });
  candle2=chart2.addSeries(LightweightCharts.CandlestickSeries,{
    upColor:'#26a69a',downColor:'#ef5350',wickUpColor:'#26a69a',wickDownColor:'#ef5350',
    borderVisible:true, borderUpColor:'#26a69a', borderDownColor:'#ef5350'});
  paneScale(chart2,0,candle2).applyOptions({scaleMargins:{top:0.08,bottom:0.08}});
  volume2=chart2.addSeries(LightweightCharts.HistogramSeries,
    {priceFormat:{type:'volume'}, priceScaleId:'right'}, 1);
  paneScale(chart2,1,volume2).applyOptions({scaleMargins:{top:0.10,bottom:0}});
  layoutPanes(chart2, $('chart2'));
  new ResizeObserver(()=>{ const el=$('chart2'); chart2.resize(el.clientWidth, el.clientHeight);
    layoutPanes(chart2, el); }).observe($('chart2'));
  // 途中で2画面に切り替えた時、2画面目だけ「普通の目盛り」のままになっていたので、
  // 作った直後に今の設定（対数/普通）をそろえる
  try{ applyScaleMode(); }catch(e){}
}

// 2画面目を描画（実データ→ダメならサンプル。時間足はメインと共通）
let render2Token=0;
async function render2(){
  if(layoutMode==='1' || !chart2) return;
  $('c2sym').textContent=c2.ticker+' ▾';
  store.set('mychart-c2', c2.ticker);
  const my=++render2Token;
  const t2=c2.ticker, cacheKey=t2+'@'+current.step;
  // 取得できたのが「実データ」か「サンプル」かを必ず持ち回る。
  // 以前は失敗を黙って握りつぶしてサンプルに差し替えていたため、
  // 2画面目に架空の価格が本物の顔で表示されていた
  let d=realCache[cacheKey], isReal=!!d, failMsg='';
  if(!d && store.get('td-key','')){
    try{ d=await loadData(t2, current.step); isReal=true; }
    catch(e){ failMsg = (e && e.kind==='api') ? ('APIエラー: '+(e.message||'')) : '取得できず'; }
    if(my!==render2Token) return;            // 古い応答は捨てる
  }
  if(isReal && d) priceRemember(t2, d.candles);
  if(!d){ d=sampleDataset(t2, current.step); isReal=false; }
  if(d.candles.length) applyPricePrecision(candle2, d.candles[d.candles.length-1].close);
  candle2.setData(d.candles); volume2.setData(d.vols);
  chart2.applyOptions({ timeScale:{ timeVisible: current.step==='65m', secondsVisible:false } });
  const n2=d.candles.length, show2=initialBars($('chart2'));
  if(n2>show2+20) chart2.timeScale().setVisibleLogicalRange({from:n2-show2, to:n2+3});
  else chart2.timeScale().fitContent();
  const last=d.candles[d.candles.length-1], prev=d.candles[d.candles.length-2];
  if(!isReal){
    // 架空の数字は出さない（メイン画面の「サンプル」バッジと同じ考え方）
    $('c2price').innerHTML='<span class="err">サンプル'+(failMsg?'／'+escHtml(failMsg):'')+'</span>';
  } else if(last && prev && prev.close){
    const chg=(last.close-prev.close)/prev.close*100;
    $('c2price').textContent=fmtPrice(last.close)+' ('+(chg>=0?'+':'')+chg.toFixed(2)+'%)';
  } else {
    $('c2price').textContent = last ? fmtPrice(last.close) : '-';
  }
}

// レイアウト切り替え（'1'→'v'→'h'→'1'…）
function setLayout(m){
  layoutMode=m; store.set('mychart-layout', m);
  $('splitWrap').className = m==='v' ? 'split-v' : m==='h' ? 'split-h' : 'split-1';
  $('c2pane').style.display = (m==='1') ? 'none' : 'flex';

/* 価格目盛りの切り替え（対数 ⇔ 普通）
   株価が数倍〜十数倍動く銘柄は、普通の目盛りだと安値圏が潰れて見えない。
   対数目盛りなら「何％動いたか」が同じ幅で表示され、TradingViewと同じ見え方になる */
let logScale = store.get('mychart-logscale', false);
function applyScaleMode(){
  const opts={ mode: logScale ? 1 : 0 };   // 1=対数 / 0=普通
  try{ paneScale(chart,0,candleSeries).applyOptions(opts); }catch(e){}
  try{ if(candle2) paneScale(chart2,0,candle2).applyOptions(opts); }catch(e){}
  // 出来高の枠は必ず「普通の目盛り」に戻す（対数になると棒の高さが読めなくなる）
  try{ paneScale(chart,1,volumeSeries).applyOptions({mode:0}); }catch(e){}
  try{ if(volume2) paneScale(chart2,1,volume2).applyOptions({mode:0}); }catch(e){}
  const b=$('scaleBtn');
  if(b){ b.textContent = logScale ? '対数' : '普通'; b.classList.toggle('active', logScale); }
}
$('scaleBtn').addEventListener('click', ()=>{
  logScale=!logScale; store.set('mychart-logscale', logScale);
  applyScaleMode();
  setFoot(logScale ? '対数目盛り（値動きの％が同じ幅で見える）' : '普通の目盛り（値幅が同じ幅で見える）');
});

/* 今すぐ最新に：表示中の銘柄のキャッシュを捨てて取り直す
   （他の銘柄の保存は残すので、APIの無駄遣いにならない） */
async function refreshNow(){
  const btn=$('refreshBtn');
  if(btn.classList.contains('busy')) return;   // 連打防止
  btn.classList.add('busy');
  const targets=[current.ticker];
  if(layoutMode!=='1' && c2.ticker && !targets.includes(c2.ticker)) targets.push(c2.ticker);
  // メモリと端末の保存から、対象銘柄ぶんだけ削除
  Object.keys(htfFailed).forEach(k=>delete htfFailed[k]);   // 失敗の記録を消して再挑戦できるように
  for(const t of targets){
    Object.keys(realCache).forEach(k=>{ if(k.startsWith(t+'@')) delete realCache[k]; });
    await diskDropTicker(t);
  }
  setFoot('最新データを取得中…');
  // 価格帯別出来高の集計メモも捨てる（同じ本数でも中身が変わっている可能性がある）
  drawings.forEach(d=>{ if(d._vp) delete d._vp; });
  try{
    await render();
    if(layoutMode!=='1') await render2();
    applyIndicators();
    const now=new Date();
    setFoot('最新に更新しました（'+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+'）');
  }catch(e){ setFoot('更新できませんでした: '+(e&&e.message?e.message:'')); }
  btn.classList.remove('busy');
}
$('refreshBtn').addEventListener('click', refreshNow);
/* ⟳ を長押しすると、描画の位置の診断を下のバーに出す。
   位置がおかしい時、推測ではなく実際の数値で原因を切り分けるため */
(function(){
  let t=null;
  const btn=$('refreshBtn');
  const start=()=>{ clearTimeout(t); diagOnce=false;
    t=setTimeout(()=>{ diagOnce=true; diagDrawing(); }, 700); };
  const stop =()=>{ clearTimeout(t); };
  btn.addEventListener('pointerdown', start);
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev, stop));
  // 長押しの直後は指を離した時の「タップ」を無効にする。
  // そうしないと診断を出した直後に更新が走り、表示が消えるうえAPIも1回使ってしまう
  btn.addEventListener('click', e=>{
    if(diagOnce){ diagOnce=false; e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);
})();

/* =========================================================
   スワイプで銘柄切替（TradingView風）
   ヘッダー/数値の行=メイン画面、2画面目の銘柄バー=2画面目 が切り替わる
   ========================================================= */
let suppressClickUntil=0;   // スワイプ直後の「タップ誤発動」を防ぐ

function stepSymbol(dir, target){
  const list=activeList().tickers;
  if(!list.length){ setFoot('ウォッチリストが空です（＋追加で銘柄を入れてください）'); return; }
  const cur=(target===2) ? c2.ticker : current.ticker;
  let i=list.indexOf(cur);
  // リストに無い銘柄からのスワイプは端から始める
  i = (i<0) ? (dir>0 ? 0 : list.length-1) : (i+dir+list.length)%list.length;
  if(target===2){ c2.ticker=list[i]; render2(); }
  else { current.ticker=list[i]; render(); }
  setFoot(list[i]+'（'+(i+1)+'/'+list.length+'・'+activeList().name+(target===2?'・2画面目':'')+'）');
}
function swipeTarget(el, target){
  if(!el) return;
  let sx=0, sy=0, t0=0, tracking=false;
  el.addEventListener('pointerdown', e=>{
    // 画面の左右端から始まるスワイプは、ブラウザの「戻る/進む」と
    // 取り合いになって誤作動するので、こちらでは拾わない。
    // 端から離れた場所でのスワイプはこれまでどおり使える
    const W=window.innerWidth||390;
    if(e.clientX<48 || e.clientX>W-48){ tracking=false; return; }
    sx=e.clientX; sy=e.clientY; t0=Date.now(); tracking=true;
  });
  window.addEventListener('pointerup', e=>{
    if(!tracking) return; tracking=false;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>60 && Math.abs(dy)<50 && Date.now()-t0<600){
      suppressClickUntil=Date.now()+400;      // 直後のタップ扱いを無効化
      stepSymbol(dx<0 ? 1 : -1, target);
    }
  });
}
swipeTarget(document.querySelector('header'), 1);

/* =========================================================
   設定のバックアップ（Safariの自動削除対策）
   iPhoneのSafariは「7日間開かないサイトの保存データを消す」ことがある。
   そこで①消さないよう申請し、②ファイルに書き出し/読み込みできるようにする
   ========================================================= */
// ① ブラウザに「このデータは消さないで」と申請（対応していれば効く）
if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(()=>{});
}

// アプリが使っている保存キー一覧（バックアップの対象）
const BK_KEYS=['mychart-lists','mychart-active-list','mychart-favs','mychart-last',
  'mychart-drawings','custom-inds','td-key','mychart-layout','mychart-c2',
  'mychart-max','mychart-chips-collapsed','user-symbols','mychart-backup-at','mychart-prices',
  'mychart-logscale','mychart-tools-open','mychart-api-count','mychart-magnet','mychart-api-times'];   // 目盛り(対数/普通)。以前ここに書き漏れていて復元されなかった

// 書き出し：全設定を1つのファイルにしてダウンロード（「ファイル」アプリに保存できる）
function buildBackup(includeKey){
  const data={ _app:'mychart', _at:new Date().toISOString() };
  BK_KEYS.forEach(k=>{
    if(k==='td-key' && !includeKey) return;      // APIキーを含めない選択もできる
    const v=localStorage.getItem(k); if(v!=null) data[k]=v;
  });
  return JSON.stringify(data);
}
function exportSettings(){
  askChoice('バックアップにAPIキーを含めますか？',
    'APIキーを含めない（安全・推奨）',
    'APIキーも含める（復元がラク）',
    ans=>doExport(ans==='B'));
}
function doExport(includeKey){
  const text=buildBackup(includeKey);
  let downloaded=false;
  try{
    const blob=new Blob([text],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const d=new Date(), pad=n=>String(n).padStart(2,'0');
    a.href=url; a.download=`mychart-settings-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    downloaded=true;
  }catch(e){}
  store.set('mychart-backup-at', Date.now());
  renderBackupInfo();
  // ホーム画面アプリ等でダウンロードが効かない環境向けに、文字でも渡せるようにする
  showBackupText(text, downloaded, includeKey);
}


// 書き出した内容を文字でも見せる（ホーム画面アプリではダウンロードが効かないことがある）
function showBackupText(text, downloaded, includeKey){
  $('bkTextTitle').textContent = (includeKey ? '【APIキーを含みます・取扱注意】' : '【APIキーは含みません】')
    + (downloaded
    ? 'ファイルに書き出しました。うまく保存できない場合は、下の文字をコピーしてメモ等に貼り付けて保管してください。'
    : 'ダウンロードできない環境のようです。下の文字をコピーして、メモ等に貼り付けて保管してください。');
  $('bkTextArea').value=text;
  $('bkTextBack').classList.add('open');
}
$('bkTextClose').addEventListener('click', ()=>$('bkTextBack').classList.remove('open'));
$('bkTextCopy').addEventListener('click', ()=>{
  const ta=$('bkTextArea');
  ta.select(); ta.setSelectionRange(0, 999999);
  try{
    if(navigator.clipboard) navigator.clipboard.writeText(ta.value);
    else document.execCommand('copy');
    setFoot('バックアップをコピーしました。メモアプリ等に貼り付けて保管してください');
  }catch(e){ setFoot('コピーできませんでした。長押しして手動でコピーしてください'); }
});

// 読み込み：書き出したファイルを選んで、設定を復元する
function importSettings(){
  askChoice('バックアップの読み込み方法を選んでください',
    'ファイルを選ぶ', '文字を貼り付ける',
    ans=>{
      if(ans==='B'){ askText('バックアップの文字を貼り付けてください', '', v=>applyBackupText(v)); return; }
      importFromFile();
    });
}
function importFromFile(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json,text/plain';
  inp.addEventListener('change', ()=>{
    const f=inp.files && inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ applyBackupText(String(r.result)); };
    r.readAsText(f);
  });
  inp.click();
}

// バックアップの中身を実際に適用する（ファイル・文字貼り付け共通）
/* 復元の直前に、今の設定を「ひとつ前」として端末に退避しておく。
   間違ったファイルを選ぶと今までのウォッチリストや描画が上書きされ、
   確認も無く戻せなかった。⚙の「ひとつ前に戻す」で復旧できるようにする */
const UNDO_KEY='mychart-undo';
function saveUndo(){
  try{
    const d={_app:'mychart', _at:new Date().toISOString()};
    BK_KEYS.forEach(k=>{ const v=localStorage.getItem(k); if(v!=null) d[k]=v; });
    localStorage.setItem(UNDO_KEY, JSON.stringify(d));
    return true;
  }catch(e){ return false; }   // 容量不足でも復元自体は続行する
}
function applyBackupText(text){
  try{
    const data=JSON.parse(text);
    if(!data || data._app!=='mychart') throw new Error('このアプリのバックアップではないようです');
    // 中身が空同然のファイルは、事故で全部消したのと同じになるので止める
    const found=BK_KEYS.filter(k=>data[k]!=null);
    if(found.length===0) throw new Error('中身が空のようです（復元を中止しました）');
    saveUndo();                                   // ← 今の状態を退避
    found.forEach(k=>localStorage.setItem(k, data[k]));
    setFoot(found.length+'件を復元しました（⚙の「ひとつ前に戻す」で取り消せます）。読み込み直します…');
    setTimeout(()=>location.reload(), 1200);
  }catch(e){ setFoot('読み込めませんでした: '+(e&&e.message?e.message:'')); }
}
/* 直前の復元を取り消す */
function undoRestore(){
  try{
    const raw=localStorage.getItem(UNDO_KEY);
    if(!raw){ setFoot('戻せる状態がありません'); return; }
    const d=JSON.parse(raw);
    const found=BK_KEYS.filter(k=>d[k]!=null);
    if(!found.length){ setFoot('戻せる状態がありません'); return; }
    saveUndo();                                   // 「戻す」の取り消しもできるように
    found.forEach(k=>localStorage.setItem(k, d[k]));
    setFoot('ひとつ前の状態に戻しました。読み込み直します…');
    setTimeout(()=>location.reload(), 1200);
  }catch(e){ setFoot('戻せませんでした: '+(e&&e.message?e.message:'')); }
}

// 最後にバックアップした日を表示（30日以上前なら注意を促す）
function renderBackupInfo(){
  const el=$('bkInfo'); if(!el) return;
  const at=store.get('mychart-backup-at', 0);
  if(!at){ el.textContent='（未実施）'; el.style.color='#f5a623'; return; }
  const days=Math.floor((Date.now()-at)/86400000);
  el.textContent='（最終: '+(days===0?'今日':days+'日前')+'）';
  el.style.color = days>=30 ? '#f5a623' : 'var(--muted)';
}

$('bkUndo').addEventListener('click', undoRestore);
// 戻せる状態が無いうちはボタンを目立たせない
(function(){ const b=$('bkUndo');
  if(b && !localStorage.getItem(UNDO_KEY)){ b.style.opacity='0.45'; }
})();
renderBackupInfo();

render();
setLayout(layoutMode);   // 前回のレイアウト（1画面/上下/左右）を復元
applyScaleMode();        // 前回選んだ目盛り（対数/普通）を復元
setTimeout(()=>{ const f=$('foot'); if(f) f.textContent='起動しました  '+APP_VERSION; }, 300);
if(store.get('mychart-max', false)) setMax(true);   // 前回「最大化」なら復元
} // main() ここまで

// 部品が用意できたら起動（プレビューで読み込めない時は案内を表示）
whenReady(main);
</script>
</body>
</html>
